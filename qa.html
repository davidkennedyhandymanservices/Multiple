<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5c5c">
<title>Handyman Manager - QA Assessments</title>
<style>
:root{--ink:#14232f;--bg:#e9edef;--card:#fff;--ac:#0f5c5c;--tape:#f2c230;--mut:#5b6b76;--bad:#b3261e;--ok:#1b7a43;--ln:#cfd7dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:5px solid var(--tape);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
header img.hdr-logo{width:38px;height:38px;object-fit:contain;background:white;border-radius:7px;padding:2px;flex-shrink:0}
header b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.88;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:white;white-space:nowrap;flex-shrink:0;cursor:pointer}
.sync-pill.online{background:#1b7a43}
main{max-width:780px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,35,47,.04)}
h2,h3{margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.small{font-size:12px;color:var(--mut)}
button{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:white;font-weight:650;margin:3px 3px 3px 0;cursor:pointer}
button.secondary{background:white;color:var(--ac);border:2px solid var(--ac)}
button.danger{background:#9e2525}
button.w{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:45px;padding:9px;border:1px solid #9aa8b0;border-radius:8px;margin:3px 0 10px;background:white;color:var(--ink)}
textarea{min-height:76px}
label{font-weight:650;font-size:14px;display:block}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.row:last-child{border:0;padding-bottom:0}
.tag{background:var(--tape);color:#111;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}
.doc-card{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:10px 0;background:#fafbfc}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.std-list{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.std-badge{background:#eef4f4;color:var(--ac);border:1px solid #c3d5d5;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
.check-card{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:10px 0;background:#fbfcfd}
.status-group{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.status-pill-btn{min-height:38px;padding:6px 12px;font-size:13px;border-radius:999px;border:1.5px solid var(--ac);background:white;color:var(--ac)}
.status-pill-btn.active{background:var(--ac);color:white}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
canvas.signature{width:100%;height:130px;border:2px dashed #9aa8b0;border-radius:8px;touch-action:none;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;min-height:58px;font-size:12px;padding:4px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--tape);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#14232f;color:white;padding:10px 15px;border-radius:8px;display:none;z-index:10;max-width:90%;text-align:center}
dialog{width:min(700px,96%);max-height:92vh;border:0;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<main id="view"></main>

<script src="core.js"></script>
<script>
"use strict";

let qaDraftState = {
  taskId: '',
  existingReportId: '',
  checks: [],
  contractorSig: '',
  clientSig: ''
};

let qaSigDrawn = {
  sigInspector: false,
  sigClient: false
};

function buildBritishStandardChecks(taskObj, quoteObj) {
  const stds = resolveBritishStandards(taskObj);
  const s0 = stds[0] || 'BS 8000 (Workmanship on building sites)';
  const s1 = stds[1] || s0;
  const s2 = stds[2] || s1;
  const quoteSummary = quoteObj?.items?.length
    ? quoteObj.items.map((it) => it.description).join('; ')
    : taskObj?.description || taskObj?.task || 'agreed task scope';

  return [
    {
      id: 'chk-1',
      label: 'Check 1 (Scope & Deliverables)',
      standard: s0,
      question: `Completed task deliverables match the agreed quotation scope and client instructions. (Quoted scope: ${quoteSummary})`,
      status: 'Pass',
      note: '',
      photos: []
    },
    {
      id: 'chk-2',
      label: 'Check 2 (Materials & Application)',
      standard: s1,
      question: `Materials, sealants, fixings, and installation methods comply with ${s1} and manufacturer instructions.`,
      status: 'Pass',
      note: '',
      photos: []
    },
    {
      id: 'chk-3',
      label: 'Check 3 (Workmanship & Finish)',
      standard: s0,
      question: `Workmanship finish, joint integrity, and alignment meet ${s0} standards with no defects or snags.`,
      status: 'Pass',
      note: '',
      photos: []
    },
    {
      id: 'chk-4',
      label: 'Check 4 (Property Protection & Safety)',
      standard: s2,
      question: `Adjacent surfaces, fixtures, and services are protected and checked for safe operation under ${s2}.`,
      status: 'Pass',
      note: '',
      photos: []
    },
    {
      id: 'chk-5',
      label: 'Check 5 (Site Handover & Cleanliness)',
      standard: s0,
      question: 'Work area and surrounding property left clean, safe, and tidy upon handover.',
      status: 'Pass',
      note: '',
      photos: []
    }
  ];
}

async function getTaskQuoteBundle(taskId) {
  const task = await get('jobs', taskId);
  if (!task) return null;
  const customer = task.customerId ? await get('customers', task.customerId) : null;
  const quotes = (await all('quotes'))
    .filter((q) => q.jobId === taskId)
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  const quote = quotes[0] || null;
  return { task, customer, quote };
}

async function renderQaPage() {
  const [tasks, quotes, reports] = await Promise.all([
    all('jobs').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0))),
    all('quotes'),
    all('qaReports').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0)))
  ]);

  const quoteByTask = new Map();
  for (const q of [...quotes].sort((a, b) => (b.created || 0) - (a.created || 0))) {
    if (!quoteByTask.has(q.jobId)) quoteByTask.set(q.jobId, q);
  }

  $('#view').innerHTML = `
    <div class="c">
      <h2>Quality Assurance (QA) Assessments</h2>
      <button type="button" class="w" onclick="openQaAssessmentModal()">+ New QA Assessment</button>
    </div>

    <div class="c">
      <h3>Completed &amp; Draft QA Reports (${reports.length})</h3>
      ${
        reports.length
          ? reports
              .map((r) => {
                const isSigned = r.status === 'Signed';
                const qaRef = formatDocRef('qa', r.qaRef || r.jobRef || r.quoteNumber);
                const quoRef = formatDocRef('quo', r.quoteNumber || r.qaRef || r.jobRef);
                return `
                  <div class="doc-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <b>${esc(qaRef)} - ${esc(r.customerName || 'Client')}</b>
                      <span class="tag ${isSigned ? 'ok' : ''}">${esc(r.status || 'Draft')}</span>
                    </div>
                    <div class="m" style="margin-top:4px">
                      Ref: <b>${esc(qaRef)}</b> - Quote: <b>${esc(quoRef)}</b>
                      ${r.taskName ? ` - ${esc(r.taskName)}` : ''}
                    </div>
                    <div class="small">
                      Inspection Date: ${dateFmt(r.inspectionDate || '') || 'Not set'}
                      ${r.summary ? ` - ${esc(r.summary)}` : ''}
                    </div>
                    <div class="doc-actions">
                      <button type="button" onclick="openQaPdfById('${esc(r.id)}')">View / Save PDF</button>
                      <button type="button" class="secondary" onclick="shareQaPdfById('${esc(r.id)}')">Share</button>
                      <button type="button" class="secondary" onclick="openQaAssessmentModal('${esc(r.jobId || '')}', '${esc(r.id)}')">Edit</button>
                      <button type="button" class="secondary" onclick="navigateTo('invoices.html', { taskId: '${esc(r.jobId || '')}' })">Create Invoice</button>
                      <button type="button" class="danger" onclick="confirmDeleteQaReport('${esc(r.id)}')">Delete</button>
                    </div>
                  </div>`;
              })
              .join('')
          : '<p class="m">No QA reports recorded yet. Start an assessment above.</p>'
      }
    </div>

    <div class="c">
      <h3>Tasks Ready for QA Inspection (${tasks.length})</h3>
      ${
        tasks.length
          ? tasks
              .map((t) => {
                const q = quoteByTask.get(t.id);
                const baseRef = q?.documentNumber || t.ref;
                const qaRef = formatDocRef('qa', baseRef);
                const quoRef = formatDocRef('quo', baseRef);
                const stds = resolveBritishStandards(t);
                return `
                  <div class="row">
                    <div>
                      <b>${esc(qaRef)} - ${esc(t.customerName)}</b>
                      <div class="m">${esc(t.task || 'Task')} - ${esc(t.description || '')}</div>
                      <div class="small">Quote: ${esc(quoRef)} - Standards: ${esc(stds.join(', '))}</div>
                    </div>
                    <button type="button" onclick="openQaAssessmentModal('${esc(t.id)}')">Inspect</button>
                  </div>`;
              })
              .join('')
          : '<p class="m">No tasks found. Create a task &amp; quotation first.</p>'
      }
    </div>
  `;
}

async function openQaAssessmentModal(preselectedTaskId = '', existingReportId = '') {
  const existing = existingReportId ? await get('qaReports', existingReportId) : null;
  const tasks = (await all('jobs')).sort((a, b) => (b.created || 0) - (a.created || 0));
  if (!tasks.length && !existing) {
    toast('Create a task & quotation first');
    return navigateTo('tasks.html', { action: 'new' });
  }

  const chosenTaskId = existing?.jobId || preselectedTaskId || tasks[0]?.id || '';
  const bundle = await getTaskQuoteBundle(chosenTaskId);
  const task = bundle?.task || {};
  const quote = bundle?.quote || null;

  const baseRef = quote?.documentNumber || task.ref || existing?.qaRef;
  const qaRef = formatDocRef('qa', baseRef);
  const quoRef = formatDocRef('quo', baseRef);
  const tskRef = formatDocRef('tsk', baseRef);
  const standards = resolveBritishStandards(task);

  const initialChecks =
    existing?.checks?.length
      ? existing.checks.map((c) => ({ ...c, photos: Array.isArray(c.photos) ? [...c.photos] : [] }))
      : buildBritishStandardChecks(task, quote);

  qaDraftState = {
    taskId: task.id || '',
    existingReportId: existing?.id || '',
    checks: initialChecks,
    contractorSig: existing?.contractorSignature || '',
    clientSig: existing?.clientSignature || ''
  };

  const scopeSummary =
    existing?.scopeSummary ||
    (quote?.items?.length
      ? quote.items.map((it) => `${it.description} (${GBP(it.amount)})`).join(', ')
      : task.description || task.task || '');

  modal(`
    <h2>${existing ? 'Edit QA Assessment' : 'New QA Assessment'} (${esc(qaRef)})</h2>
    <p class="m">Task: <b>${esc(tskRef)}</b> - Quote: <b>${esc(quoRef)}</b></p>

    <div class="std-list">
      ${standards.map((s) => `<span class="std-badge">${esc(s)}</span>`).join('')}
    </div>

    <form id="qaForm" onsubmit="event.preventDefault();saveQaAssessment()">
      <label>Select Task</label>
      <select name="taskId" id="qaTaskSelect" onchange="switchQaTask(this.value, '${esc(existing?.id || '')}')">
        ${tasks
          .map(
            (t) =>
              `<option value="${esc(t.id)}" ${t.id === task.id ? 'selected' : ''}>${esc(formatDocRef('tsk', t.ref))} - ${esc(t.customerName)} (${esc(t.task || 'Task')})</option>`
          )
          .join('')}
      </select>

      <label>QA Reference</label>
      <input name="qaRef" value="${esc(qaRef)}" readonly>

      <label>Customer &amp; Site Address</label>
      <input name="customerSite" value="${esc(`${task.customerName || ''} - ${task.customerAddress || bundle?.customer?.address || ''}`)}" readonly>

      <label>Quoted Scope Summary</label>
      <textarea name="scopeSummary">${esc(scopeSummary)}</textarea>

      <label>Inspection Date</label>
      <input name="inspectionDate" type="date" value="${esc(existing?.inspectionDate || today())}" required>

      <h3>British Standards Inspection Checks (${qaDraftState.checks.length})</h3>
      <div id="qaChecksContainer"></div>

      <label style="margin-top:10px">Overall Handover Notes</label>
      <textarea name="notes" placeholder="Overall quality summary, handover remarks, or follow-up items...">${esc(existing?.notes || '')}</textarea>

      <div class="c">
        <h3>Dual Sign-Off</h3>
        <label>Inspector / Contractor Name</label>
        <input name="inspectorName" value="${esc(existing?.inspectorName || brand.name || 'Contractor')}" required>

        <label>Inspector / Contractor Signature</label>
        <canvas id="sigInspector" class="signature"></canvas>
        <button type="button" class="secondary" onclick="clearQaSig('sigInspector')">Clear Inspector Signature</button>

        <label style="margin-top:10px">Client Name</label>
        <input name="clientName" value="${esc(existing?.clientName || task.customerName || '')}" required>

        <label>Client Signature</label>
        <canvas id="sigClient" class="signature"></canvas>
        <button type="button" class="secondary" onclick="clearQaSig('sigClient')">Clear Client Signature</button>
      </div>

      <button type="submit" class="w" style="margin-top:8px">Save QA Report &amp; Generate PDF</button>
    </form>
  `);

  renderQaChecksList();
  initQaSigCanvas('sigInspector', qaDraftState.contractorSig, 'sigInspector');
  initQaSigCanvas('sigClient', qaDraftState.clientSig, 'sigClient');
}

function renderQaChecksList() {
  const container = $('#qaChecksContainer');
  if (!container) return;

  container.innerHTML = qaDraftState.checks
    .map(
      (chk, idx) => `
      <div class="check-card">
        <b>${esc(chk.label)} - <span style="color:var(--ac)">${esc(chk.standard)}</span></b>
        <div class="m" style="margin:4px 0 8px">${esc(chk.question)}</div>

        <label>Result</label>
        <div class="status-group">
          ${['Pass', 'Fail', 'N/A']
            .map(
              (st) => `
              <button
                type="button"
                class="status-pill-btn ${chk.status === st ? 'active' : ''}"
                onclick="setQaCheckStatus(${idx}, '${st}')"
              >${st}</button>`
            )
            .join('')}
        </div>

        <label>Inspection Note</label>
        <input
          type="text"
          value="${esc(chk.note || '')}"
          placeholder="Add check note or defect observation..."
          oninput="setQaCheckNote(${idx}, this.value)"
        >

        <label>Check Evidence Photos</label>
        <input type="file" accept="image/*" multiple onchange="addQaCheckPhotos(${idx}, this)">
        <div class="thumbs">
          ${(chk.photos || [])
            .map(
              (pSrc, pIdx) =>
                `<img src="${esc(pSrc)}" alt="Check photo ${pIdx + 1}" title="Tap to remove" onclick="removeQaCheckPhoto(${idx}, ${pIdx})" style="cursor:pointer">`
            )
            .join('')}
        </div>
      </div>`
    )
    .join('');
}

function setQaCheckStatus(idx, status) {
  if (!qaDraftState.checks[idx]) return;
  qaDraftState.checks[idx].status = status;
  renderQaChecksList();
}

function setQaCheckNote(idx, val) {
  if (!qaDraftState.checks[idx]) return;
  qaDraftState.checks[idx].note = val;
}

async function addQaCheckPhotos(idx, input) {
  if (!qaDraftState.checks[idx]) return;
  const files = Array.from(input.files || []);
  for (const file of files) {
    try {
      const dataUrl = await fileData(file);
      qaDraftState.checks[idx].photos.push(dataUrl);
    } catch (e) {
      toast('Could not add photo: ' + e.message);
    }
  }
  input.value = '';
  renderQaChecksList();
}

function removeQaCheckPhoto(chkIdx, photoIdx) {
  if (!qaDraftState.checks[chkIdx]) return;
  qaDraftState.checks[chkIdx].photos.splice(photoIdx, 1);
  renderQaChecksList();
}

async function switchQaTask(newTaskId, existingReportId = '') {
  const form = $('#qaForm');
  const f = form ? formData(form) : {};
  const bundle = await getTaskQuoteBundle(newTaskId);
  const task = bundle?.task || {};
  const quote = bundle?.quote || null;

  qaDraftState.checks = buildBritishStandardChecks(task, quote);
  await openQaAssessmentModal(newTaskId, existingReportId);

  if (f.inspectionDate && $('#qaForm [name="inspectionDate"]')) {
    $('#qaForm [name="inspectionDate"]').value = f.inspectionDate;
  }
  if (f.notes && $('#qaForm [name="notes"]')) {
    $('#qaForm [name="notes"]').value = f.notes;
  }
}

function initQaSigCanvas(canvasId, existingUrl, flagKey) {
  const canvas = $('#' + canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = 760;
  canvas.height = 220;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#14232f';
  qaSigDrawn[flagKey] = false;

  if (existingUrl) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      qaSigDrawn[flagKey] = true;
    };
    img.src = existingUrl;
  }

  let drawing = false;
  const pt = (e) => {
    const r = canvas.getBoundingClientRect();
    return [
      ((e.clientX - r.left) * canvas.width) / r.width,
      ((e.clientY - r.top) * canvas.height) / r.height
    ];
  };

  canvas.onpointerdown = (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    ctx.moveTo(...pt(e));
  };
  canvas.onpointermove = (e) => {
    if (!drawing) return;
    ctx.lineTo(...pt(e));
    ctx.stroke();
    qaSigDrawn[flagKey] = true;
  };
  canvas.onpointerup = canvas.onpointercancel = () => {
    drawing = false;
  };
}

function clearQaSig(canvasId) {
  const canvas = $('#' + canvasId);
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  qaSigDrawn[canvasId] = false;
}

async function saveQaAssessment() {
  const form = $('#qaForm');
  if (!form || !form.reportValidity()) return;
  const f = formData(form);

  const bundle = await getTaskQuoteBundle(f.taskId);
  if (!bundle?.task) return toast('Please choose a valid task');

  const task = bundle.task;
  const quote = bundle.quote;
  const old = qaDraftState.existingReportId
    ? await get('qaReports', qaDraftState.existingReportId)
    : null;

  const baseRef = quote?.documentNumber || task.ref || old?.qaRef;
  const qaRef = formatDocRef('qa', baseRef);
  const quoRef = formatDocRef('quo', baseRef);
  const tskRef = formatDocRef('tsk', baseRef);
  const standards = resolveBritishStandards(task);

  const contractorSigUrl = qaSigDrawn.sigInspector
    ? $('#sigInspector').toDataURL('image/png')
    : '';
  const clientSigUrl = qaSigDrawn.sigClient
    ? $('#sigClient').toDataURL('image/png')
    : '';

  const passCount = qaDraftState.checks.filter((c) => c.status === 'Pass').length;
  const failCount = qaDraftState.checks.filter((c) => c.status === 'Fail').length;
  const summary = `${passCount} Pass, ${failCount} Fail of ${qaDraftState.checks.length} checks`;
  const status = contractorSigUrl && clientSigUrl ? 'Signed' : 'Draft';

  const record = {
    ...(old || {}),
    id: old?.id || uid(),
    jobId: task.id,
    jobRef: tskRef,
    qaRef,
    quoteId: quote?.id || '',
    quoteNumber: quoRef,
    customerId: task.customerId || '',
    customerName: task.customerName || '',
    customerAddress: task.customerAddress || bundle.customer?.address || '',
    taskName: task.task || 'Task',
    scopeSummary: (f.scopeSummary || '').trim(),
    standards,
    checks: qaDraftState.checks,
    notes: (f.notes || '').trim(),
    inspectionDate: f.inspectionDate || today(),
    inspectorName: (f.inspectorName || brand.name || 'Contractor').trim(),
    clientName: (f.clientName || task.customerName || '').trim(),
    contractorSignature: contractorSigUrl,
    clientSignature: clientSigUrl,
    summary,
    status,
    created: old?.created || Date.now(),
    updatedAt: Date.now()
  };

  try {
    const pdfBlob = await makeQaPdf(record);
    const filename = pdfFilenameFromRef(qaRef, 'QA_Report');
    record.filename = filename;
    record.pdfData = await fileData(new File([pdfBlob], filename, { type: 'application/pdf' }));

    if (isSupabaseConfigured()) {
      try {
        record.pdfStorage = await uploadPdfToSupabase(
          pdfBlob,
          `qa/${extractSeqDigits(qaRef)}/${filename}`
        );
      } catch (upErr) {
        console.warn('QA PDF upload skipped:', upErr.message);
      }
    }

    await put('qaReports', record);
    closeModal();
    toast(`Saved ${qaRef} & generated QA PDF`);
    await renderQaPage();
  } catch (e) {
    console.error(e);
    toast('Could not generate QA PDF: ' + e.message);
  }
}

async function embedImageFromDataUrl(pdf, dataUrl) {
  if (!dataUrl || typeof dataUrl !== 'string' || !dataUrl.startsWith('data:image')) return null;
  const bytes = Uint8Array.from(atob(dataUrl.split(',')[1]), (ch) => ch.charCodeAt(0));
  if (dataUrl.startsWith('data:image/png')) return await pdf.embedPng(bytes);
  return await pdf.embedJpg(bytes);
}

async function makeQaPdf(r) {
  const qaRef = pdfSafeText(r.qaRef || formatDocRef('qa', r.jobRef));
  const ctx = await createBrandedPdfDocument(qaRef);
  const { pdf, font, bold, width: W, height: H, margin } = ctx;
  const quoRef = pdfSafeText(r.quoteNumber || formatDocRef('quo', qaRef));
  const tskRef = pdfSafeText(formatDocRef('tsk', qaRef));
  const [ar, ag, ab] = hexToRgbTuple(brand.color || '#0f5c5c');
  const accentCol = PDFLib.rgb(ar, ag, ab);
  const inkCol = PDFLib.rgb(0.08, 0.14, 0.18);
  const tintCol = PDFLib.rgb(0.96, 0.97, 0.98);

  let page = pdf.addPage([W, H]);
  let y = drawStandardPdfHeader(ctx, page, 'QUALITY ASSURANCE', qaRef);

  function ensureSpace(needed = 24) {
    if (y - needed < ctx.footerHeight) {
      page = pdf.addPage([W, H]);
      y = drawStandardPdfHeader(ctx, page, 'QUALITY ASSURANCE', qaRef);
    }
  }

  function writeText(text, size = 9.2, isBold = false, indent = 0) {
    const blocks = pdfSafeText(text || '').split('\n');
    const maxW = W - margin * 2 - indent - 6;
    for (const blk of blocks) {
      const words = blk.trim().split(/\s+/).filter(Boolean);
      if (!words.length) {
        ensureSpace(size + 4.5);
        y -= size + 4.5;
        continue;
      }
      let line = '';
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (font.widthOfTextAtSize(pdfSafeText(test), size) > maxW && line) {
          ensureSpace(size + 4.5);
          page.drawText(pdfSafeText(line), {
            x: margin + indent,
            y,
            size,
            font: isBold ? bold : font,
            color: inkCol
          });
          y -= size + 4.5;
          line = w;
        } else {
          line = test;
        }
      }
      if (line) {
        ensureSpace(size + 4.5);
        page.drawText(pdfSafeText(line), {
          x: margin + indent,
          y,
          size,
          font: isBold ? bold : font,
          color: inkCol
        });
        y -= size + 4.5;
      }
    }
  }

  function sectionHeading(title) {
    ensureSpace(28);
    y -= 6;
    page.drawRectangle({
      x: margin,
      y: y - 3,
      width: W - margin * 2,
      height: 17,
      color: tintCol
    });
    page.drawText(pdfSafeText(String(title || '').toUpperCase()), {
      x: margin + 6,
      y: y + 1,
      size: 9.5,
      font: bold,
      color: accentCol
    });
    y -= 18;
  }

  sectionHeading('Inspection & Task Summary');
  writeText(`Customer: ${r.customerName || ''} - QA Ref: ${qaRef} - Quote Ref: ${quoRef} - Task Ref: ${tskRef}`, 9.2, true);
  if (r.customerAddress) writeText(`Site Address: ${r.customerAddress.replace(/\n/g, ', ')}`, 9);
  writeText(`Task Category: ${r.taskName || 'Task'} - Inspection Date: ${dateFmt(r.inspectionDate || '')} - Status: ${r.status || 'Draft'}`, 9);
  if (r.scopeSummary) writeText(`Quoted Scope: ${r.scopeSummary}`, 9);

  sectionHeading('British Standards Followed');
  for (const std of r.standards || []) {
    writeText(`- ${std}`, 9, false, 4);
  }

  sectionHeading('Checklist & Quality Checks');
  for (const chk of r.checks || []) {
    ensureSpace(34);
    writeText(`${chk.label} [${chk.status || 'Pass'}] - ${chk.standard || ''}`, 9.3, true, 2);
    writeText(chk.question || '', 8.8, false, 6);
    if (chk.note) {
      writeText(`Note: ${chk.note}`, 8.8, false, 10);
    }
    for (const pSrc of chk.photos || []) {
      try {
        const img = await embedImageFromDataUrl(pdf, pSrc);
        if (img) {
          const dims = img.scale(Math.min(130 / img.width, 90 / img.height));
          ensureSpace(dims.height + 12);
          page.drawImage(img, {
            x: margin + 10,
            y: y - dims.height,
            width: dims.width,
            height: dims.height
          });
          y -= dims.height + 10;
        }
      } catch (e) {
        // Skip invalid photo
      }
    }
    y -= 4;
  }

  if (r.notes) {
    sectionHeading('Overall Handover Notes');
    writeText(r.notes, 9, false, 2);
  }

  sectionHeading('Dual Sign-Off');
  for (const [roleLabel, partyName, sigUrl] of [
    ['Inspector / Contractor', r.inspectorName, r.contractorSignature],
    ['Client', r.clientName, r.clientSignature]
  ]) {
    ensureSpace(84);
    writeText(`${roleLabel}: ${partyName || '_________________________'}`, 9.5, true, 2);
    if (sigUrl) {
      try {
        const img = await embedImageFromDataUrl(pdf, sigUrl);
        if (img) {
          const dims = img.scale(Math.min(155 / img.width, 46 / img.height));
          page.drawImage(img, {
            x: margin + 6,
            y: y - dims.height,
            width: dims.width,
            height: dims.height
          });
          y -= dims.height + 12;
        }
      } catch (e) {
        y -= 18;
      }
    } else {
      writeText('Signature: [Awaiting signature]', 8.8, false, 6);
    }
  }

  if (getValidInsurancePolicies().length) {
    ensureSpace(70);
    y = drawPublicLiabilityInsurance(ctx, page, y);
  }
  applyStandardPdfFooters(ctx, `Quality Inspection Certificate ${qaRef}`);
  return new Blob([await pdf.save()], { type: 'application/pdf' });
}

async function resolveQaBlob(r) {
  if (r.pdfData) {
    return await fetch(r.pdfData).then((res) => res.blob());
  }
  if (r.pdfStorage) {
    const remote = await fetchPdfBlobFromSupabase(r.pdfStorage);
    if (remote) return remote;
  }
  return await makeQaPdf(r);
}

async function openQaPdfById(reportId) {
  const win = window.open('about:blank', '_blank');
  try {
    const r = await get('qaReports', reportId);
    if (!r) throw new Error('QA report not found');
    const blob = await resolveQaBlob(r);
    presentPdf(
      blob,
      pdfFilenameFromRef(r.qaRef || formatDocRef('qa', r.jobRef), 'QA_Report'),
      win
    );
  } catch (e) {
    if (win) win.close();
    toast('Could not open QA PDF: ' + e.message);
  }
}

async function shareQaPdfById(reportId) {
  try {
    const r = await get('qaReports', reportId);
    if (!r) throw new Error('QA report not found');
    const blob = await resolveQaBlob(r);
    await shareOrDownloadFile(
      blob,
      pdfFilenameFromRef(r.qaRef || formatDocRef('qa', r.jobRef), 'QA_Report'),
      `QA Report ${r.qaRef || ''}`
    );
  } catch (e) {
    toast('Could not share QA PDF: ' + e.message);
  }
}

function confirmDeleteQaReport(reportId) {
  modal(`
    <h2>Delete QA Report?</h2>
    <p class="m">Remove this QA assessment report? The task and quotation remain untouched.</p>
    <button type="button" class="danger w" onclick="deleteQaReport('${esc(reportId)}')">Yes, Delete QA Report</button>
  `);
}

async function deleteQaReport(reportId) {
  await del('qaReports', reportId);
  closeModal();
  toast('QA report deleted');
  await renderQaPage();
}

(async () => {
  try {
    const { params } = await initCore('qa');
    await renderQaPage();

    if (params.taskId) {
      const tId = params.taskId;
      clearQueryParams();
      await openQaAssessmentModal(tId);
    }
  } catch (e) {
    console.error('QA boot error:', e);
  }
})();
</script>
