<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5c5c">
<title>Handyman Manager - Invoices</title>
<style>
:root{--ink:#14232f;--bg:#e9edef;--card:#fff;--ac:#0f5c5c;--tape:#f2c230;--mut:#5b6b76;--bad:#b3261e;--ok:#1b7a43;--ln:#cfd7dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:5px solid var(--tape);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
header img.hdr-logo{width:38px;height:38px;object-fit:contain;background:white;border-radius:7px;padding:2px;flex-shrink:0}
header b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.88;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:white;white-space:nowrap;flex-shrink:0;cursor:pointer}
.sync-pill.online{background:#1b7a43}
main{max-width:780px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,35,47,.04)}
h2,h3{margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.small{font-size:12px;color:var(--mut)}
button{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:white;font-weight:650;margin:3px 3px 3px 0;cursor:pointer}
button.secondary{background:white;color:var(--ac);border:2px solid var(--ac)}
button.danger{background:#9e2525}
button.w{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:45px;padding:9px;border:1px solid #9aa8b0;border-radius:8px;margin:3px 0 10px;background:white;color:var(--ink)}
textarea{min-height:82px}
label{font-weight:650;font-size:14px;display:block}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.row:last-child{border:0;padding-bottom:0}
.tag{background:var(--tape);color:#111;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}
.doc-card{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:10px 0;background:#fafbfc}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;min-height:58px;font-size:12px;padding:4px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--tape);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#14232f;color:white;padding:10px 15px;border-radius:8px;display:none;z-index:10;max-width:90%;text-align:center}
dialog{width:min(680px,96%);max-height:92vh;border:0;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<main id="view"></main>

<script src="core.js"></script>
<script>
"use strict";

function parseInvoiceLines(text) {
  return String(text || '')
    .split('\n')
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const parts = line.split('|');
      const description = (parts[0] || '').trim();
      const amount = Number((parts[1] || '0').trim().replace(/£/g, '')) || 0;
      return { description, amount };
    });
}

function sumInvoiceLines(items) {
  return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
}

async function getTaskQuoteData(taskId) {
  const task = await get('jobs', taskId);
  if (!task) return null;
  const customer = task.customerId ? await get('customers', task.customerId) : null;
  const quotes = (await all('quotes'))
    .filter((q) => q.jobId === taskId)
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  const quote = quotes[0] || null;
  return { task, customer, quote };
}

async function renderInvoicesPage() {
  const [tasks, quotes, invoices] = await Promise.all([
    all('jobs').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0))),
    all('quotes'),
    all('invoices').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0)))
  ]);

  const quoteByTask = new Map();
  for (const q of [...quotes].sort((a, b) => (b.created || 0) - (a.created || 0))) {
    if (!quoteByTask.has(q.jobId)) quoteByTask.set(q.jobId, q);
  }

  const invByTask = new Map();
  for (const inv of invoices) {
    if (!invByTask.has(inv.jobId)) invByTask.set(inv.jobId, inv);
  }

  $('#view').innerHTML = `
    <div class="c">
      <h2>Invoices &amp; Billing</h2>
      <p class="m">Generate structured A4 PDF invoices using the shared task reference sequence (e.g. <code>${esc(formatDocRef('inv', '001'))}</code>) and track payment status.</p>
      <button type="button" class="w" onclick="openInvoiceEditor()">+ Create Invoice from Task</button>
    </div>

    <div class="c">
      <h3>Issued &amp; Draft Invoices (${invoices.length})</h3>
      ${
        invoices.length
          ? invoices
              .map((inv) => {
                const isPaid = inv.paymentStatus === 'Paid';
                const invRef = formatDocRef('inv', inv.documentNumber || inv.jobRef);
                const quoRef = formatDocRef('quo', inv.quoteNumber || inv.documentNumber || inv.jobRef);
                return `
                  <div class="doc-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <b>${esc(invRef)} - ${esc(inv.customerName || 'Client')}</b>
                      <span class="tag ${isPaid ? 'ok' : ''}">${esc(inv.paymentStatus || 'Unpaid')}</span>
                    </div>
                    <div class="m" style="margin-top:4px">
                      Ref: <b>${esc(invRef)}</b> - Quote: <b>${esc(quoRef)}</b> - Total: <b>${GBP(inv.total)}</b>
                    </div>
                    <div class="small">
                      Issued: ${dateFmt(inv.createdDate || '')}
                      ${inv.dueDate ? ` - Due: ${dateFmt(inv.dueDate)}` : ''}
                      ${inv.paymentMethod ? ` - Method: ${esc(inv.paymentMethod)}` : ''}
                    </div>
                    <div class="doc-actions">
                      <button type="button" onclick="openInvoicePdfById('${esc(inv.id)}')">View / Save PDF</button>
                      <button type="button" class="secondary" onclick="shareInvoicePdfById('${esc(inv.id)}')">Share</button>
                      <button type="button" class="secondary" onclick="openInvoiceEditor('${esc(inv.jobId || '')}', '${esc(inv.id)}')">Edit</button>
                      ${
                        !isPaid
                          ? `<button type="button" class="secondary" onclick="markInvoicePaid('${esc(inv.id)}')">Mark Paid</button>`
                          : ''
                      }
                      <button type="button" class="danger" onclick="confirmDeleteInvoice('${esc(inv.id)}')">Delete</button>
                    </div>
                  </div>`;
              })
              .join('')
          : '<p class="m">No invoices created yet. Select a task below to raise an invoice.</p>'
      }
    </div>

    <div class="c">
      <h3>Tasks Ready for Invoicing (${tasks.length})</h3>
      ${
        tasks.length
          ? tasks
              .map((t) => {
                const q = quoteByTask.get(t.id);
                const existingInv = invByTask.get(t.id);
                const baseRef = q?.documentNumber || t.ref;
                const invRef = formatDocRef('inv', baseRef);
                const quoRef = formatDocRef('quo', baseRef);
                const amt = existingInv ? existingInv.total : q ? q.total : t.amount;
                return `
                  <div class="row">
                    <div>
                      <b>${esc(invRef)} - ${esc(t.customerName)}</b>
                      <div class="m">${esc(t.task || 'Task')} - ${esc(t.description || '')}</div>
                      <div class="small">Quote: ${esc(quoRef)} - ${GBP(amt)}</div>
                    </div>
                    <button type="button" onclick="openInvoiceEditor('${esc(t.id)}', '${esc(existingInv?.id || '')}')">${existingInv ? 'Edit Invoice' : 'Create Invoice'}</button>
                  </div>`;
              })
              .join('')
          : '<p class="m">No tasks found. Create a task &amp; quotation first.</p>'
      }
    </div>
  `;
}

async function openInvoiceEditor(preselectedTaskId = '', existingInvoiceId = '') {
  const existing = existingInvoiceId ? await get('invoices', existingInvoiceId) : null;
  const tasks = (await all('jobs')).sort((a, b) => (b.created || 0) - (a.created || 0));
  if (!tasks.length && !existing) {
    toast('Create a task & quotation first');
    return navigateTo('tasks.html', { action: 'new' });
  }

  const chosenTaskId = existing?.jobId || preselectedTaskId || tasks[0]?.id || '';
  const ctx = await getTaskQuoteData(chosenTaskId);
  const task = ctx?.task || {};
  const quote = ctx?.quote || null;

  const baseRef = quote?.documentNumber || task.ref || existing?.documentNumber;
  const invRef = formatDocRef('inv', baseRef);
  const quoRef = formatDocRef('quo', baseRef);
  const tskRef = formatDocRef('tsk', baseRef);

  const linesText = existing?.items?.length
    ? existing.items.map((it) => `${it.description} | ${Number(it.amount) || 0}`).join('\n')
    : quote?.items?.length
      ? quote.items.map((it) => `${it.description} | ${Number(it.amount) || 0}`).join('\n')
      : `${task.description || task.task || 'Agreed task'} | ${Number(quote ? quote.total : task.amount) || 0}`;

  modal(`
    <h2>${existing ? 'Edit Invoice' : 'Create Invoice'} (${esc(invRef)})</h2>
    <p class="m">Task: <b>${esc(tskRef)}</b> - Quote: <b>${esc(quoRef)}</b></p>

    <form id="invoiceForm" onsubmit="event.preventDefault();saveInvoice()">
      <label>Select Task</label>
      <select name="taskId" id="invoiceTaskSelect" onchange="switchInvoiceTask(this.value, '${esc(existing?.id || '')}')">
        ${tasks
          .map(
            (t) =>
              `<option value="${esc(t.id)}" ${t.id === task.id ? 'selected' : ''}>${esc(formatDocRef('tsk', t.ref))} - ${esc(t.customerName)}</option>`
          )
          .join('')}
      </select>

      <label>Invoice Reference</label>
      <input name="docNumber" value="${esc(invRef)}" readonly>

      <label>Line Items (one per line: description | amount)</label>
      <textarea name="items" required>${esc(linesText)}</textarea>

      <label>Invoice Date</label>
      <input name="createdDate" type="date" value="${esc(existing?.createdDate || today())}" required>

      <label>Payment Due Date (Optional)</label>
      <input name="dueDate" type="date" value="${esc(existing?.dueDate || '')}">

      <label>Payment Status</label>
      <select name="paymentStatus">
        ${['Unpaid', 'Partially Paid', 'Paid']
          .map((st) => `<option ${(existing?.paymentStatus || 'Unpaid') === st ? 'selected' : ''}>${st}</option>`)
          .join('')}
      </select>

      <label>Payment Method</label>
      <select name="paymentMethod">
        ${['Bank Transfer', 'Cash', 'Card', 'Cheque', 'Pending']
          .map((pm) => `<option ${(existing?.paymentMethod || 'Bank Transfer') === pm ? 'selected' : ''}>${pm}</option>`)
          .join('')}
      </select>

      <label>Bank / Payment Instructions</label>
      <textarea name="bankDetails" placeholder="Sort code, account number, payment reference...">${esc(existing?.bankDetails ?? brand.bankDetails ?? '')}</textarea>

      <label>Invoice Notes &amp; Terms</label>
      <textarea name="notes">${esc(existing?.notes ?? quote?.notes ?? task.description ?? '')}</textarea>

      <button type="submit" class="w">Save Invoice &amp; Generate PDF</button>
    </form>
  `);
}

async function switchInvoiceTask(newTaskId, existingInvoiceId = '') {
  const form = $('#invoiceForm');
  const f = form ? formData(form) : {};
  await openInvoiceEditor(newTaskId, existingInvoiceId);
  if (f.createdDate && $('#invoiceForm [name="createdDate"]')) {
    $('#invoiceForm [name="createdDate"]').value = f.createdDate;
  }
  if (f.dueDate && $('#invoiceForm [name="dueDate"]')) {
    $('#invoiceForm [name="dueDate"]').value = f.dueDate;
  }
  if (f.bankDetails && $('#invoiceForm [name="bankDetails"]')) {
    $('#invoiceForm [name="bankDetails"]').value = f.bankDetails;
  }
}

async function saveInvoice() {
  const form = $('#invoiceForm');
  if (!form || !form.reportValidity()) return;
  const f = formData(form);

  const items = parseInvoiceLines(f.items);
  if (!items.length) return toast('Add at least one invoice line item');

  const ctx = await getTaskQuoteData(f.taskId);
  if (!ctx?.task) return toast('Please choose a valid task');

  const task = ctx.task;
  const quote = ctx.quote;
  const old = (await all('invoices')).find((inv) => inv.jobId === task.id) || null;
  const baseRef = quote?.documentNumber || task.ref || old?.documentNumber;
  const invRef = formatDocRef('inv', baseRef);
  const quoRef = formatDocRef('quo', baseRef);
  const tskRef = formatDocRef('tsk', baseRef);
  const total = sumInvoiceLines(items);
  const payStatus = f.paymentStatus || 'Unpaid';

  const invoiceRecord = {
    ...(old || {}),
    id: old?.id || uid(),
    jobId: task.id,
    jobRef: tskRef,
    documentNumber: invRef,
    quoteId: quote?.id || '',
    quoteNumber: quoRef,
    customerId: task.customerId || '',
    customerName: task.customerName || '',
    customerAddress: task.customerAddress || ctx.customer?.address || '',
    customerPhone: ctx.customer?.phone || '',
    customerEmail: ctx.customer?.email || '',
    taskCategory: task.task || 'Task',
    items,
    total,
    createdDate: f.createdDate || today(),
    dueDate: f.dueDate || '',
    paymentStatus: payStatus,
    paymentMethod: f.paymentMethod || 'Bank Transfer',
    bankDetails: (f.bankDetails || '').trim(),
    notes: (f.notes || '').trim(),
    created: old?.created || Date.now(),
    updatedAt: Date.now()
  };

  const pdfBlob = await makeInvoicePdf(invoiceRecord);
  const filename = pdfFilenameFromRef(invRef, 'Invoice');
  invoiceRecord.filename = filename;
  invoiceRecord.pdfData = await fileData(new File([pdfBlob], filename, { type: 'application/pdf' }));

  if (isSupabaseConfigured()) {
    try {
      invoiceRecord.pdfStorage = await uploadPdfToSupabase(
        pdfBlob,
        `invoices/${extractSeqDigits(invRef)}/${filename}`
      );
    } catch (upErr) {
      console.warn('Invoice PDF upload skipped:', upErr.message);
    }
  }

  await put('invoices', invoiceRecord);

  task.paymentStatus = payStatus;
  if (payStatus === 'Paid') {
    task.status = 'Completed';
  }
  task.updatedAt = Date.now();
  await put('jobs', task);

  closeModal();
  toast(`Saved ${invRef} & generated invoice PDF`);
  await renderInvoicesPage();
}

async function markInvoicePaid(invoiceId) {
  const inv = await get('invoices', invoiceId);
  if (!inv) return;
  inv.paymentStatus = 'Paid';
  inv.updatedAt = Date.now();
  const pdfBlob = await makeInvoicePdf(inv);
  inv.filename = pdfFilenameFromRef(formatDocRef('inv', inv.documentNumber || inv.jobRef), 'Invoice');
  inv.pdfData = await fileData(new File([pdfBlob], inv.filename, { type: 'application/pdf' }));
  await put('invoices', inv);

  if (inv.jobId) {
    const task = await get('jobs', inv.jobId);
    if (task) {
      task.paymentStatus = 'Paid';
      task.status = 'Completed';
      task.updatedAt = Date.now();
      await put('jobs', task);
    }
  }
  toast('Invoice marked as Paid');
  await renderInvoicesPage();
}

async function makeInvoicePdf(inv) {
  const invRef = pdfSafeText(inv.documentNumber || formatDocRef('inv', inv.jobRef));
  const ctx = await createBrandedPdfDocument(invRef);
  const { pdf, font, bold, width: W, height: H, margin } = ctx;
  const quoRef = pdfSafeText(inv.quoteNumber || formatDocRef('quo', invRef));
  const tskRef = pdfSafeText(formatDocRef('tsk', invRef));
  const [ar, ag, ab] = hexToRgbTuple(brand.color || '#0f5c5c');
  const accentCol = PDFLib.rgb(ar, ag, ab);
  const inkCol = PDFLib.rgb(0.08, 0.14, 0.18);
  const mutCol = PDFLib.rgb(0.38, 0.44, 0.49);
  const ruleCol = PDFLib.rgb(0.82, 0.86, 0.89);
  const tintCol = PDFLib.rgb(0.95, 0.97, 0.98);
  const contentW = W - margin * 2;
  const amtColX = W - margin - 92;

  let page = pdf.addPage([W, H]);
  let y = drawStandardPdfHeader(ctx, page, 'INVOICE', invRef);

  function startInvoicePage() {
    page = pdf.addPage([W, H]);
    y = drawStandardPdfHeader(ctx, page, 'INVOICE', invRef);
  }

  function ensureSpace(needed = 24) {
    if (y - needed < ctx.footerHeight) {
      startInvoicePage();
    }
  }

  function wrapLines(text, size, maxWidth) {
    const out = [];
    const blocks = pdfSafeText(text || '').split('\n');
    for (const blk of blocks) {
      const words = blk.trim().split(/\s+/).filter(Boolean);
      if (!words.length) {
        out.push('');
        continue;
      }
      let line = '';
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (font.widthOfTextAtSize(pdfSafeText(test), size) > maxWidth && line) {
          out.push(line);
          line = w;
        } else {
          line = test;
        }
      }
      if (line) out.push(line);
    }
    return out;
  }

  function drawTableHeader() {
    ensureSpace(28);
    page.drawRectangle({
      x: margin,
      y: y - 4,
      width: contentW,
      height: 20,
      color: accentCol
    });
    page.drawText('DESCRIPTION OF WORK / ITEM', {
      x: margin + 8,
      y: y + 2,
      size: 8.8,
      font: bold,
      color: PDFLib.rgb(1, 1, 1)
    });
    page.drawText('AMOUNT', {
      x: amtColX,
      y: y + 2,
      size: 8.8,
      font: bold,
      color: PDFLib.rgb(1, 1, 1)
    });
    y -= 24;
  }

  // Top Two-Column Summary Block: Bill To (Left) & Invoice Details (Right)
  const leftX = margin;
  const rightX = margin + contentW * 0.54;
  const leftMaxW = contentW * 0.5;
  const rightMaxW = contentW * 0.44;

  const clientLines = [
    ...(inv.customerName ? [inv.customerName] : []),
    ...(inv.customerAddress ? inv.customerAddress.replace(/\n/g, ', ').split(', ') : []),
    ...([inv.customerPhone, inv.customerEmail].filter(Boolean).length
      ? [[inv.customerPhone, inv.customerEmail].filter(Boolean).join(' - ')]
      : [])
  ];

  const metaLines = [
    `Invoice Ref: ${invRef}`,
    `Quotation Ref: ${quoRef}`,
    `Task Ref: ${tskRef}`,
    `Invoice Date: ${dateFmt(inv.createdDate || '') || '-'}`,
    ...(inv.dueDate ? [`Due Date: ${dateFmt(inv.dueDate)}`] : []),
    `Status: ${inv.paymentStatus || 'Unpaid'}`,
    ...(inv.paymentMethod ? [`Method: ${inv.paymentMethod}`] : [])
  ];

  ensureSpace(110);
  const blockTopY = y;
  page.drawRectangle({
    x: margin,
    y: blockTopY - 96,
    width: contentW,
    height: 100,
    color: tintCol
  });

  page.drawText('BILL TO', {
    x: leftX + 8,
    y: blockTopY - 12,
    size: 8.5,
    font: bold,
    color: accentCol
  });
  let ly = blockTopY - 26;
  for (const rawL of clientLines.slice(0, 4)) {
    const wrapped = wrapLines(rawL, 9, leftMaxW);
    for (const wl of wrapped.slice(0, 2)) {
      page.drawText(pdfSafeText(wl), {
        x: leftX + 8,
        y: ly,
        size: 9,
        font: rawL === inv.customerName ? bold : font,
        color: inkCol
      });
      ly -= 12;
    }
  }

  page.drawText('INVOICE SUMMARY', {
    x: rightX,
    y: blockTopY - 12,
    size: 8.5,
    font: bold,
    color: accentCol
  });
  let ry = blockTopY - 26;
  for (const mLine of metaLines.slice(0, 6)) {
    const wrapped = wrapLines(mLine, 8.8, rightMaxW);
    for (const wl of wrapped.slice(0, 1)) {
      page.drawText(pdfSafeText(wl), {
        x: rightX,
        y: ry,
        size: 8.8,
        font: mLine.startsWith('Invoice Ref:') || mLine.startsWith('Status:') ? bold : font,
        color: inkCol
      });
      ry -= 11.5;
    }
  }

  y = blockTopY - 114;

  // Itemised Table
  drawTableHeader();
  const descMaxW = amtColX - margin - 16;

  for (let i = 0; i < (inv.items || []).length; i++) {
    const item = inv.items[i];
    const descLines = wrapLines(`${i + 1}. ${item.description || 'Task item'}`, 9.5, descMaxW);
    const rowHeight = Math.max(22, descLines.length * 13 + 8);
    if (y - rowHeight < ctx.footerHeight) {
      startInvoicePage();
      drawTableHeader();
    }

    let curY = y;
    for (const dl of descLines) {
      page.drawText(pdfSafeText(dl), {
        x: margin + 8,
        y: curY,
        size: 9.5,
        font,
        color: inkCol
      });
      curY -= 13;
    }

    page.drawText(pdfSafeText(GBP(item.amount)), {
      x: amtColX,
      y,
      size: 9.5,
      font: bold,
      color: inkCol
    });

    y -= rowHeight;
    page.drawLine({
      start: { x: margin, y: y + 4 },
      end: { x: W - margin, y: y + 4 },
      thickness: 0.5,
      color: ruleCol
    });
    y -= 4;
  }

  // Totals & Balance Summary Box (Right-Aligned)
  const totalVal = Number(inv.total) || 0;
  const paidVal = inv.paymentStatus === 'Paid' ? totalVal : 0;
  const balanceVal = Math.max(0, totalVal - paidVal);

  ensureSpace(78);
  y -= 8;
  const boxW = 220;
  const boxX = W - margin - boxW;
  page.drawRectangle({
    x: boxX,
    y: y - 58,
    width: boxW,
    height: 64,
    color: tintCol
  });

  page.drawText('Subtotal:', { x: boxX + 10, y: y - 10, size: 9.2, font, color: mutCol });
  page.drawText(pdfSafeText(GBP(totalVal)), { x: boxX + 125, y: y - 10, size: 9.2, font: bold, color: inkCol });

  page.drawText('Paid:', { x: boxX + 10, y: y - 25, size: 9.2, font, color: mutCol });
  page.drawText(pdfSafeText(GBP(paidVal)), { x: boxX + 125, y: y - 25, size: 9.2, font: bold, color: inkCol });

  page.drawLine({
    start: { x: boxX + 10, y: y - 33 },
    end: { x: boxX + boxW - 10, y: y - 33 },
    thickness: 0.75,
    color: ruleCol
  });

  page.drawText('TOTAL DUE:', { x: boxX + 10, y: y - 48, size: 10.5, font: bold, color: accentCol });
  page.drawText(pdfSafeText(GBP(balanceVal)), { x: boxX + 125, y: y - 48, size: 10.5, font: bold, color: inkCol });

  y -= 78;

  // Payment Details & Notes
  if (inv.bankDetails) {
    ensureSpace(46);
    page.drawText('PAYMENT / BANK TRANSFER DETAILS', {
      x: margin,
      y,
      size: 9,
      font: bold,
      color: accentCol
    });
    y -= 14;
    for (const bl of wrapLines(inv.bankDetails, 9, contentW)) {
      ensureSpace(16);
      page.drawText(pdfSafeText(bl), { x: margin, y, size: 9, font, color: inkCol });
      y -= 13;
    }
    y -= 6;
  }

  if (inv.notes) {
    ensureSpace(46);
    page.drawText('NOTES & PAYMENT TERMS', {
      x: margin,
      y,
      size: 9,
      font: bold,
      color: accentCol
    });
    y -= 14;
    for (const nl of wrapLines(inv.notes, 9, contentW)) {
      ensureSpace(16);
      page.drawText(pdfSafeText(nl), { x: margin, y, size: 9, font, color: inkCol });
      y -= 13;
    }
  }

  if (getValidInsurancePolicies().length) {
    ensureSpace(70);
    y = drawPublicLiabilityInsurance(ctx, page, y);
  }
  applyStandardPdfFooters(ctx, `Invoice ${invRef}`);
  return new Blob([await pdf.save()], { type: 'application/pdf' });
}

async function resolveInvoiceBlob(inv) {
  if (inv.pdfData) {
    return await fetch(inv.pdfData).then((r) => r.blob());
  }
  if (inv.pdfStorage) {
    const remote = await fetchPdfBlobFromSupabase(inv.pdfStorage);
    if (remote) return remote;
  }
  return await makeInvoicePdf(inv);
}

async function openInvoicePdfById(invoiceId) {
  const win = window.open('about:blank', '_blank');
  try {
    const inv = await get('invoices', invoiceId);
    if (!inv) throw new Error('Invoice not found');
    const blob = await resolveInvoiceBlob(inv);
    presentPdf(
      blob,
      pdfFilenameFromRef(inv.documentNumber || formatDocRef('inv', inv.jobRef), 'Invoice'),
      win
    );
  } catch (e) {
    if (win) win.close();
    toast('Could not open invoice PDF: ' + e.message);
  }
}

async function shareInvoicePdfById(invoiceId) {
  try {
    const inv = await get('invoices', invoiceId);
    if (!inv) throw new Error('Invoice not found');
    const blob = await resolveInvoiceBlob(inv);
    await shareOrDownloadFile(
      blob,
      pdfFilenameFromRef(inv.documentNumber || formatDocRef('inv', inv.jobRef), 'Invoice'),
      `Invoice ${inv.documentNumber || ''}`
    );
  } catch (e) {
    toast('Could not share invoice PDF: ' + e.message);
  }
}

function confirmDeleteInvoice(invoiceId) {
  modal(`
    <h2>Delete Invoice?</h2>
    <p class="m">Remove this invoice record? The task and quotation remain untouched.</p>
    <button type="button" class="danger w" onclick="deleteInvoice('${esc(invoiceId)}')">Yes, Delete Invoice</button>
  `);
}

async function deleteInvoice(invoiceId) {
  await del('invoices', invoiceId);
  closeModal();
  toast('Invoice deleted');
  await renderInvoicesPage();
}

(async () => {
  try {
    const { params } = await initCore('invoices');
    await renderInvoicesPage();

    if (params.taskId) {
      const tId = params.taskId;
      clearQueryParams();
      await openInvoiceEditor(tId);
    }
  } catch (e) {
    console.error('Invoices boot error:', e);
  }
})();
</script>
