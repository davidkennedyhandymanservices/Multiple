<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5c5c">
<title>Handyman Manager - Overview</title>
<style>
:root{--ink:#14232f;--bg:#e9edef;--card:#fff;--ac:#0f5c5c;--tape:#f2c230;--mut:#5b6b76;--bad:#b3261e;--ok:#1b7a43;--ln:#cfd7dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:5px solid var(--tape);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
header img.hdr-logo{width:38px;height:38px;object-fit:contain;background:white;border-radius:7px;padding:2px;flex-shrink:0}
header b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.88;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:white;white-space:nowrap;flex-shrink:0;cursor:pointer}
.sync-pill.online{background:#1b7a43}
main{max-width:780px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,35,47,.04)}
h2,h3{margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.small{font-size:12px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:460px){.grid{grid-template-columns:1fr}}
.stat{border:1px solid var(--ln);border-radius:10px;padding:12px;background:#fafbfc;cursor:pointer}
.stat b{display:block;font-size:21px;color:var(--ac)}
button{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:white;font-weight:650;margin:3px 3px 3px 0;cursor:pointer}
button.secondary{background:white;color:var(--ac);border:2px solid var(--ac)}
button.w{width:100%}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.row:last-child{border:0;padding-bottom:0}
.tag{background:var(--tape);color:#111;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;min-height:58px;font-size:12px;padding:4px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--tape);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#14232f;color:white;padding:10px 15px;border-radius:8px;display:none;z-index:10;max-width:90%;text-align:center}
dialog{width:min(540px,96%);max-height:92vh;border:0;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<main id="view"></main>

<script src="core.js"></script>
<script>
"use strict";

async function renderHome() {
  const [customers, tasks, quotes, invoices] = await Promise.all([
    all('customers'),
    all('jobs'),
    all('quotes'),
    all('invoices')
  ]);

  const quoteByTask = new Map();
  for (const q of [...quotes].sort((a, b) => (b.created || 0) - (a.created || 0))) {
    if (!quoteByTask.has(q.jobId)) quoteByTask.set(q.jobId, q);
  }

  const invByTask = new Map();
  for (const inv of [...invoices].sort((a, b) => (b.created || 0) - (a.created || 0))) {
    if (!invByTask.has(inv.jobId)) invByTask.set(inv.jobId, inv);
  }

  const paidRevenue = invoices
    .filter((inv) => inv.paymentStatus === 'Paid')
    .reduce((sum, inv) => sum + (Number(inv.total) || 0), 0);

  const openTasks = tasks.filter(
    (t) => (invByTask.get(t.id)?.paymentStatus || t.paymentStatus) !== 'Paid'
  ).length;

  const recentTasks = [...tasks]
    .sort((a, b) => (b.created || 0) - (a.created || 0))
    .slice(0, 6);

  $('#view').innerHTML = `
    <div class="c">
      <h2>Business Overview</h2>
      <div class="grid">
        <div class="stat" onclick="navigateTo('customers.html')"><b>${customers.length}</b><span class="small">Customers</span></div>
        <div class="stat" onclick="navigateTo('tasks.html')"><b>${tasks.length}</b><span class="small">Total Tasks</span></div>
        <div class="stat" onclick="navigateTo('invoices.html')"><b>${GBP(paidRevenue)}</b><span class="small">Paid Revenue</span></div>
        <div class="stat" onclick="navigateTo('tasks.html')"><b>${openTasks}</b><span class="small">Open / Unpaid Tasks</span></div>
      </div>
    </div>

    <div class="c">
      <h3>Recent Tasks</h3>
      ${
        recentTasks.length
          ? recentTasks
              .map((t) => {
                const q = quoteByTask.get(t.id);
                const inv = invByTask.get(t.id);
                const baseRef = q?.documentNumber || inv?.documentNumber || t.ref;
                const tRef = formatDocRef('tsk', baseRef);
                const qRef = formatDocRef('quo', baseRef);
                const payStatus = inv?.paymentStatus || t.paymentStatus || 'Unpaid';
                const amt = inv ? inv.total : q ? q.total : t.amount;
                const isPaid = payStatus === 'Paid';
                return `
                  <div class="row" onclick="navigateTo('tasks.html')" style="cursor:pointer">
                    <div>
                      <b>${esc(tRef)} - ${esc(t.customerName)}</b>
                      <div class="m">${esc(t.task || 'Task')} - ${esc(t.description || '')}</div>
                      <div class="small">Quote: ${esc(qRef)} - ${GBP(amt)}</div>
                    </div>
                    <span class="tag ${isPaid ? 'ok' : ''}">${esc(payStatus)}</span>
                  </div>`;
              })
              .join('')
          : '<p class="m">No tasks yet. Open Workspace to create a task.</p>'
      }
    </div>
  `;
}

(async () => {
  try {
    await initCore('home');
    await renderHome();
  } catch (e) {
    console.error('Home boot error:', e);
  }
})();
</script>
</body>
</html>
