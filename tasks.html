<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5c5c">
<title>Handyman Manager - Tasks &amp; Quotations</title>
<style>
:root{--ink:#14232f;--bg:#e9edef;--card:#fff;--ac:#0f5c5c;--tape:#f2c230;--mut:#5b6b76;--bad:#b3261e;--ok:#1b7a43;--ln:#cfd7dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:5px solid var(--tape);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
header img.hdr-logo{width:38px;height:38px;object-fit:contain;background:white;border-radius:7px;padding:2px;flex-shrink:0}
header b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.88;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:white;white-space:nowrap;flex-shrink:0;cursor:pointer}
.sync-pill.online{background:#1b7a43}
main{max-width:780px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,35,47,.04)}
h2,h3{margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.small{font-size:12px;color:var(--mut)}
button{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:white;font-weight:650;margin:3px 3px 3px 0;cursor:pointer}
button.secondary{background:white;color:var(--ac);border:2px solid var(--ac)}
button.danger{background:#9e2525}
button.w{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:45px;padding:9px;border:1px solid #9aa8b0;border-radius:8px;margin:3px 0 10px;background:white;color:var(--ink)}
textarea{min-height:82px}
label{font-weight:650;font-size:14px;display:block}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.row:last-child{border:0;padding-bottom:0}
.tag{background:var(--tape);color:#111;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}
.doc-card{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:10px 0;background:#fafbfc}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--ln)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;min-height:58px;font-size:12px;padding:4px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--tape);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#14232f;color:white;padding:10px 15px;border-radius:8px;display:none;z-index:10;max-width:90%;text-align:center}
dialog{width:min(650px,96%);max-height:92vh;border:0;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<main id="view"></main>

<script src="core.js"></script>
<script>
"use strict";

const TASK_TYPES = [
  'Replacing silicone sealant',
  'Garden gate repair',
  'Hanging shelves or hooks',
  'Flat-pack furniture assembly',
  'Painting and decorating',
  'Minor plumbing repair',
  'Door adjustment or repair',
  'Curtain pole or blind installation',
  'Tile or grout repair',
  'Fence panel repair',
  'Lock or handle replacement',
  'Gutter or downpipe minor repair',
  'Picture or mirror hanging',
  'General / Bespoke Task'
];

let pendingTaskPhotos = [];

function parseQuoteLines(text) {
  return String(text || '')
    .split('\n')
    .map((line) => line.trim())
    .filter(Boolean)
    .map((line) => {
      const parts = line.split('|');
      const description = (parts[0] || '').trim();
      const amount = Number((parts[1] || '0').trim().replace(/£/g, '')) || 0;
      return { description, amount };
    });
}

function sumQuoteLines(items) {
  return items.reduce((sum, item) => sum + (Number(item.amount) || 0), 0);
}

async function renderTasksPage() {
  const [tasks, quotes] = await Promise.all([
    all('jobs').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0))),
    all('quotes').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0)))
  ]);

  const quoteByTask = new Map();
  for (const q of quotes) {
    if (!quoteByTask.has(q.jobId)) quoteByTask.set(q.jobId, q);
  }

  $('#view').innerHTML = `
    <div class="c">
      <h2>Tasks &amp; Quotations</h2>
      <p class="m">Assign tasks with a shared reference sequence (e.g. <code>${esc(formatDocRef('tsk', '001'))}</code> / <code>${esc(formatDocRef('quo', '001'))}</code>), attach photos, and generate PDF quotations.</p>
      <button type="button" class="w" onclick="openTaskForm()">+ New Task &amp; Quotation</button>
    </div>

    <div class="c">
      <h3>Active Tasks (${tasks.length})</h3>
      ${
        tasks.length
          ? tasks
              .map((t) => {
                const q = quoteByTask.get(t.id);
                const tRef = formatDocRef('tsk', t.ref);
                const qRef = formatDocRef('quo', q?.documentNumber || t.ref);
                const displayTotal = q ? Number(q.total) || 0 : Number(t.amount) || 0;
                const badgeClass =
                  t.status === 'Completed' || t.paymentStatus === 'Paid' ? 'ok' : '';
                return `
                  <div class="doc-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <b>${esc(tRef)} - ${esc(t.customerName)}</b>
                      <span class="tag ${badgeClass}">${esc(t.status || 'Quoted')}</span>
                    </div>
                    <div class="m" style="margin-top:4px">
                      <b>${esc(t.task || 'Task')}</b> - ${esc(t.description || '')}
                    </div>
                    <div class="small">
                      Quote: <b>${esc(qRef)}</b> - Amount: <b>${GBP(displayTotal)}</b>
                      ${t.scheduledDate ? ` - Planned Start: ${dateFmt(t.scheduledDate)}` : ''}
                      ${t.customerAddress ? ` - ${esc(t.customerAddress)}` : ''}
                    </div>
                    <div class="doc-actions">
                      <button type="button" onclick="openQuoteEditor('${esc(t.id)}')">${q ? 'Edit / PDF Quote' : 'Create Quote'}</button>
                      ${
                        q
                          ? `<button type="button" class="secondary" onclick="viewQuotePdfById('${esc(q.id)}')">View Quote PDF</button>
                             <button type="button" class="secondary" onclick="shareQuotePdfById('${esc(q.id)}')">Share Quote</button>`
                          : ''
                      }
                      <button type="button" class="secondary" onclick="navigateTo('legal.html', { taskId: '${esc(t.id)}' })">Contract</button>
                      <button type="button" class="secondary" onclick="navigateTo('qa.html', { taskId: '${esc(t.id)}' })">QA</button>
                      <button type="button" class="secondary" onclick="navigateTo('invoices.html', { taskId: '${esc(t.id)}' })">Invoice</button>
                      <button type="button" class="secondary" onclick="openTaskForm('${esc(t.id)}')">Edit Task</button>
                      <button type="button" class="danger" onclick="confirmDeleteTask('${esc(t.id)}')">Delete</button>
                    </div>
                  </div>`;
              })
              .join('')
          : '<p class="m">No tasks yet. Tap "+ New Task &amp; Quotation" above to get started.</p>'
      }
    </div>
  `;
}

async function openTaskForm(existingTaskId = '', preselectedCustomerId = '') {
  const existing = existingTaskId ? await get('jobs', existingTaskId) : null;
  const customers = (await all('customers')).sort((a, b) =>
    (a.name || '').localeCompare(b.name || '')
  );

  if (!customers.length && !existing) {
    toast('Add a customer first');
    return navigateTo('customers.html', { action: 'new' });
  }

  pendingTaskPhotos = Array.isArray(existing?.photos) ? [...existing.photos] : [];
  const chosenCustomerId = existing?.customerId || preselectedCustomerId || customers[0]?.id || '';
  const initialRefPreview = existing
    ? formatDocRef('tsk', existing.ref)
    : 'Assigned automatically from 001 on save';

  modal(`
    <h2>${existing ? 'Edit Task' : 'New Task & Quotation'}</h2>
    <form id="taskForm" onsubmit="event.preventDefault();saveTask('${esc(existing?.id || '')}')">
      <label>Customer</label>
      <select name="customerId" required>
        ${customers
          .map(
            (c) =>
              `<option value="${esc(c.id)}" ${c.id === chosenCustomerId ? 'selected' : ''}>${esc(c.name)}${c.address ? ` - ${esc(c.address)}` : ''}</option>`
          )
          .join('')}
      </select>

      <label>Task Reference</label>
      <input name="ref" value="${esc(initialRefPreview)}" readonly>

      <label>Task Category</label>
      <select name="task">
        ${TASK_TYPES.map(
          (tt) => `<option ${(existing?.task || TASK_TYPES[0]) === tt ? 'selected' : ''}>${esc(tt)}</option>`
        ).join('')}
      </select>

      <label>Scope of Work / Task Description</label>
      <textarea name="description" required placeholder="Describe the task, materials, and site location...">${esc(existing?.description || '')}</textarea>

      <label>Quotation Line Items (one per line: description | amount)</label>
      <textarea name="quoteLines" placeholder="e.g. Silicone sealant replacement | 85.00">${esc(
        existing?.quoteLinesText ||
          (existing?.description ? `${existing.description} | ${Number(existing.amount) || 0}` : '')
      )}</textarea>

      <label>Planned Start of Work Date (Optional)</label>
      <input name="scheduledDate" type="date" value="${esc(existing?.scheduledDate || '')}">

      <label>Task Status</label>
      <select name="status">
        ${['Quoted', 'Booked', 'In Progress', 'Completed']
          .map((st) => `<option ${(existing?.status || 'Quoted') === st ? 'selected' : ''}>${st}</option>`)
          .join('')}
      </select>

      <label>Site / Task Photos</label>
      <input type="file" accept="image/*" multiple onchange="handleTaskPhotoInput(this)">
      <div id="taskPhotoThumbs" class="thumbs"></div>

      <button type="submit" class="w">${existing ? 'Save Task Changes' : 'Create Task & Quotation PDF'}</button>
    </form>
  `);

  renderTaskPhotoThumbs();
}

async function handleTaskPhotoInput(input) {
  const files = Array.from(input.files || []);
  for (const file of files) {
    try {
      const dataUrl = await fileData(file);
      pendingTaskPhotos.push(dataUrl);
    } catch (e) {
      toast('Could not load photo: ' + e.message);
    }
  }
  input.value = '';
  renderTaskPhotoThumbs();
}

function renderTaskPhotoThumbs() {
  const box = $('#taskPhotoThumbs');
  if (!box) return;
  box.innerHTML = pendingTaskPhotos
    .map(
      (src, idx) =>
        `<img src="${esc(src)}" alt="Task photo ${idx + 1}" title="Tap to remove" onclick="removeTaskPhoto(${idx})" style="cursor:pointer">`
    )
    .join('');
}

function removeTaskPhoto(idx) {
  pendingTaskPhotos.splice(idx, 1);
  renderTaskPhotoThumbs();
}

async function saveTask(existingTaskId = '') {
  const f = formData('taskForm');
  const customer = await get('customers', f.customerId);
  if (!customer) return toast('Please select a customer');

  const old = existingTaskId ? await get('jobs', existingTaskId) : null;
  const seqDigits = old
    ? extractSeqDigits(old.ref)
    : await allocateTaskSequenceNumber();
  const taskRef = formatDocRef('tsk', seqDigits);
  const quoteRef = formatDocRef('quo', seqDigits);

  const linesText = (f.quoteLines || '').trim();
  const parsedItems = parseQuoteLines(linesText);
  const items = parsedItems.length
    ? parsedItems
    : [{ description: (f.description || f.task || 'Agreed task').trim(), amount: Number(old?.amount) || 0 }];
  const total = sumQuoteLines(items);

  const taskRecord = {
    ...(old || {}),
    id: old?.id || uid(),
    ref: taskRef,
    seqCode: seqDigits,
    customerId: customer.id,
    customerName: customer.name,
    customerAddress: customer.address || '',
    task: f.task || 'General / Bespoke Task',
    description: (f.description || '').trim(),
    quoteLinesText:
      linesText || items.map((it) => `${it.description} | ${Number(it.amount) || 0}`).join('\n'),
    amount: total,
    scheduledDate: f.scheduledDate || '',
    status: f.status || 'Quoted',
    paymentStatus: old?.paymentStatus || 'Not paid',
    photos: [...pendingTaskPhotos],
    created: old?.created || Date.now(),
    updatedAt: Date.now()
  };

  await put('jobs', taskRecord);

  // Sync or create linked quotation with matching reference number (e.g. DKHS-quo-001)
  const existingQuotes = (await all('quotes')).filter((q) => q.jobId === taskRecord.id);
  const existingQuote = existingQuotes[0] || null;

  const quoteRecord = {
    ...(existingQuote || {}),
    id: existingQuote?.id || uid(),
    jobId: taskRecord.id,
    jobRef: taskRef,
    seqCode: seqDigits,
    documentNumber: quoteRef,
    customerId: customer.id,
    customerName: customer.name,
    customerAddress: customer.address || '',
    customerPhone: customer.phone || '',
    customerEmail: customer.email || '',
    items,
    total,
    createdDate: existingQuote?.createdDate || today(),
    validUntil: existingQuote?.validUntil || '',
    notes: existingQuote?.notes ?? taskRecord.description,
    status: existingQuote?.status || 'Draft',
    created: existingQuote?.created || Date.now(),
    updatedAt: Date.now()
  };

  const pdfBlob = await makeQuotationPdf(quoteRecord, taskRecord);
  const filename = `${quoteRef}.pdf`;
  quoteRecord.filename = filename;
  quoteRecord.pdfData = await fileData(new File([pdfBlob], filename, { type: 'application/pdf' }));

  if (isSupabaseConfigured()) {
    try {
      quoteRecord.pdfStorage = await uploadPdfToSupabase(
        pdfBlob,
        `quotations/${seqDigits}/${filename}`
      );
    } catch (upErr) {
      console.warn('Quote PDF upload skipped:', upErr.message);
    }
  }

  await put('quotes', quoteRecord);
  closeModal();
  toast(old ? `Updated ${taskRef} & ${quoteRef}` : `Created ${taskRef} & ${quoteRef}`);
  await renderTasksPage();
}

async function openQuoteEditor(taskId) {
  const task = await get('jobs', taskId);
  if (!task) return toast('Task not found');
  const customer = task.customerId ? await get('customers', task.customerId) : null;
  const existingQuotes = (await all('quotes')).filter((q) => q.jobId === taskId);
  const q = existingQuotes[0] || null;
  const seqDigits = extractSeqDigits(q?.documentNumber || task.ref);
  const quoteRef = formatDocRef('quo', seqDigits);
  const taskRef = formatDocRef('tsk', seqDigits);

  const itemsText = q?.items?.length
    ? q.items.map((it) => `${it.description} | ${Number(it.amount) || 0}`).join('\n')
    : task.quoteLinesText || `${task.description || task.task || 'Agreed task'} | ${Number(task.amount) || 0}`;

  modal(`
    <h2>Quotation (${esc(quoteRef)})</h2>
    <p class="m">Task: <b>${esc(taskRef)}</b> - Client: <b>${esc(task.customerName)}</b></p>
    <form id="quoteForm" onsubmit="event.preventDefault();saveQuoteFromModal('${esc(task.id)}', '${esc(q?.id || '')}')">
      <label>Quotation Reference</label>
      <input name="docNumber" value="${esc(quoteRef)}" readonly>

      <label>Line Items (one per line: description | amount)</label>
      <textarea name="items" required>${esc(itemsText)}</textarea>

      <label>Quotation Date</label>
      <input name="createdDate" type="date" value="${esc(q?.createdDate || today())}" required>

      <label>Valid Until (Optional)</label>
      <input name="validUntil" type="date" value="${esc(q?.validUntil || '')}">

      <label>Quotation Status</label>
      <select name="status">
        ${['Draft', 'Sent', 'Accepted', 'Declined']
          .map((st) => `<option ${(q?.status || 'Draft') === st ? 'selected' : ''}>${st}</option>`)
          .join('')}
      </select>

      <label>Scope, Notes &amp; Exclusions</label>
      <textarea name="notes">${esc(q?.notes ?? task.description ?? '')}</textarea>

      <button type="submit" class="w">Save Quotation &amp; Generate PDF</button>
    </form>
  `);
}

async function saveQuoteFromModal(taskId, existingQuoteId = '') {
  const f = formData('quoteForm');
  const items = parseQuoteLines(f.items);
  if (!items.length) return toast('Add at least one line item');

  const task = await get('jobs', taskId);
  if (!task) return toast('Task not found');
  const customer = task.customerId ? await get('customers', task.customerId) : null;
  const old = existingQuoteId ? await get('quotes', existingQuoteId) : null;
  const seqDigits = extractSeqDigits(old?.documentNumber || task.ref);
  const quoteRef = formatDocRef('quo', seqDigits);
  const taskRef = formatDocRef('tsk', seqDigits);
  const total = sumQuoteLines(items);

  const quoteRecord = {
    ...(old || {}),
    id: old?.id || uid(),
    jobId: task.id,
    jobRef: taskRef,
    seqCode: seqDigits,
    documentNumber: quoteRef,
    customerId: task.customerId || '',
    customerName: task.customerName,
    customerAddress: task.customerAddress || customer?.address || '',
    customerPhone: customer?.phone || '',
    customerEmail: customer?.email || '',
    items,
    total,
    createdDate: f.createdDate || today(),
    validUntil: f.validUntil || '',
    notes: (f.notes || '').trim(),
    status: f.status || 'Draft',
    created: old?.created || Date.now(),
    updatedAt: Date.now()
  };

  const pdfBlob = await makeQuotationPdf(quoteRecord, task);
  const filename = `${quoteRef}.pdf`;
  quoteRecord.filename = filename;
  quoteRecord.pdfData = await fileData(new File([pdfBlob], filename, { type: 'application/pdf' }));

  if (isSupabaseConfigured()) {
    try {
      quoteRecord.pdfStorage = await uploadPdfToSupabase(
        pdfBlob,
        `quotations/${seqDigits}/${filename}`
      );
    } catch (upErr) {
      console.warn('Quote PDF upload skipped:', upErr.message);
    }
  }

  await put('quotes', quoteRecord);

  task.amount = total;
  task.quoteLinesText = items.map((it) => `${it.description} | ${Number(it.amount) || 0}`).join('\n');
  task.updatedAt = Date.now();
  await put('jobs', task);

  closeModal();
  toast(`Saved ${quoteRef} & generated PDF`);
  await renderTasksPage();
}

async function makeQuotationPdf(q, taskObj = null) {
  const ctx = await createBrandedPdfDocument();
  const { pdf, font, bold, width: W, height: H, margin } = ctx;
  const refBadge = pdfSafeText(q.documentNumber || formatDocRef('quo', q.jobRef));
  const [ar, ag, ab] = hexToRgbTuple(brand.color || '#0f5c5c');
  const accentCol = PDFLib.rgb(ar, ag, ab);
  const inkCol = PDFLib.rgb(0.08, 0.14, 0.18);
  const tintCol = PDFLib.rgb(0.96, 0.97, 0.98);

  let page = pdf.addPage([W, H]);
  let y = drawStandardPdfHeader(ctx, page, 'QUOTATION', refBadge);

  function ensureSpace(needed = 24) {
    if (y - needed < 68) {
      page = pdf.addPage([W, H]);
      y = drawStandardPdfHeader(ctx, page, 'QUOTATION', refBadge);
    }
  }

  function writeLine(text, size = 9.5, isBold = false, indent = 0) {
    const blocks = pdfSafeText(text || '').split('\n');
    const maxW = W - margin * 2 - indent - 6;
    for (const blk of blocks) {
      const words = blk.trim().split(/\s+/).filter(Boolean);
      if (!words.length) {
        ensureSpace(size + 5);
        y -= size + 5;
        continue;
      }
      let line = '';
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (font.widthOfTextAtSize(pdfSafeText(test), size) > maxW && line) {
          ensureSpace(size + 5);
          page.drawText(pdfSafeText(line), {
            x: margin + indent,
            y,
            size,
            font: isBold ? bold : font,
            color: inkCol
          });
          y -= size + 5;
          line = w;
        } else {
          line = test;
        }
      }
      if (line) {
        ensureSpace(size + 5);
        page.drawText(pdfSafeText(line), {
          x: margin + indent,
          y,
          size,
          font: isBold ? bold : font,
          color: inkCol
        });
        y -= size + 5;
      }
    }
  }

  function sectionHeading(title) {
    ensureSpace(28);
    y -= 6;
    page.drawRectangle({
      x: margin,
      y: y - 3,
      width: W - margin * 2,
      height: 17,
      color: tintCol
    });
    page.drawText(pdfSafeText(String(title || '').toUpperCase()), {
      x: margin + 6,
      y: y + 1,
      size: 9.5,
      font: bold,
      color: accentCol
    });
    y -= 18;
  }

  sectionHeading('Customer & Task Details');
  writeLine(q.customerName || '', 11, true);
  if (q.customerAddress) writeLine(q.customerAddress.replace(/\n/g, ', '), 9.5);
  if (q.customerPhone || q.customerEmail) {
    writeLine([q.customerPhone, q.customerEmail].filter(Boolean).join(' - '), 9);
  }
  const tRef = formatDocRef('tsk', q.jobRef || q.documentNumber);
  writeLine(`Task Reference: ${tRef} - Quotation Reference: ${refBadge}`, 9.5, true);
  writeLine(
    `Quotation Date: ${dateFmt(q.createdDate || '')} - Status: ${q.status || 'Draft'}${q.validUntil ? ` - Valid Until: ${dateFmt(q.validUntil)}` : ''}`,
    9
  );
  if (taskObj?.scheduledDate) {
    writeLine(`Planned Start of Work: ${dateFmt(taskObj.scheduledDate)}`, 9);
  }

  sectionHeading('Quoted Line Items');
  for (const item of q.items || []) {
    writeLine(`${item.description} - ${GBP(item.amount)}`, 10, false, 4);
  }

  ensureSpace(32);
  y -= 6;
  page.drawLine({
    start: { x: margin, y: y + 10 },
    end: { x: W - margin, y: y + 10 },
    thickness: 1,
    color: PDFLib.rgb(0.75, 0.8, 0.83)
  });
  page.drawText(pdfSafeText(`TOTAL: ${GBP(q.total)}`), {
    x: margin,
    y,
    size: 13,
    font: bold,
    color: inkCol
  });
  y -= 24;

  if (q.notes) {
    sectionHeading('Scope, Notes & Exclusions');
    writeLine(q.notes, 9.5);
  }

  applyStandardPdfFooters(ctx, `Quotation ${refBadge}`);
  return new Blob([await pdf.save()], { type: 'application/pdf' });
}

async function resolveQuoteBlob(q) {
  if (q.pdfData) {
    return await fetch(q.pdfData).then((r) => r.blob());
  }
  if (q.pdfStorage) {
    const remote = await fetchPdfBlobFromSupabase(q.pdfStorage);
    if (remote) return remote;
  }
  const task = q.jobId ? await get('jobs', q.jobId) : null;
  return await makeQuotationPdf(q, task);
}

async function viewQuotePdfById(quoteId) {
  const win = window.open('about:blank', '_blank');
  try {
    const q = await get('quotes', quoteId);
    if (!q) throw new Error('Quotation not found');
    const blob = await resolveQuoteBlob(q);
    presentPdf(blob, q.filename || `${q.documentNumber || 'Quotation'}.pdf`, win);
  } catch (e) {
    if (win) win.close();
    toast('Could not open quotation PDF: ' + e.message);
  }
}

async function shareQuotePdfById(quoteId) {
  try {
    const q = await get('quotes', quoteId);
    if (!q) throw new Error('Quotation not found');
    const blob = await resolveQuoteBlob(q);
    await shareOrDownloadFile(
      blob,
      q.filename || `${q.documentNumber || 'Quotation'}.pdf`,
      `Quotation ${q.documentNumber || ''}`
    );
  } catch (e) {
    toast('Could not share quotation PDF: ' + e.message);
  }
}

function confirmDeleteTask(taskId) {
  modal(`
    <h2>Delete Task?</h2>
    <p class="m">Delete this task and its linked quotation, and reduce the task reference counter by 1?</p>
    <button type="button" class="danger w" onclick="deleteTask('${esc(taskId)}')">Yes, Delete Task &amp; Decrement Counter</button>
  `);
}

async function deleteTask(taskId) {
  const quotes = (await all('quotes')).filter((q) => q.jobId === taskId);
  for (const q of quotes) {
    await del('quotes', q.id);
  }
  await del('jobs', taskId);
  await decrementTaskSequenceNumber();
  closeModal();
  toast('Task deleted & counter reduced by 1');
  await renderTasksPage();
}

(async () => {
  try {
    const { params } = await initCore('tasks');
    await renderTasksPage();

    if (params.action === 'new') {
      const custId = params.customerId || '';
      clearQueryParams();
      await openTaskForm('', custId);
    }
  } catch (e) {
    console.error('Tasks boot error:', e);
  }
})();
</script>
</body>
