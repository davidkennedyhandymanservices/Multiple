<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f5c5c">
<title>Handyman Manager - Legal Contracts</title>
<style>
:root{--ink:#14232f;--bg:#e9edef;--card:#fff;--ac:#0f5c5c;--tape:#f2c230;--mut:#5b6b76;--bad:#b3261e;--ok:#1b7a43;--ln:#cfd7dc}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(82px + env(safe-area-inset-bottom))}
header{background:var(--ac);color:white;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:5px solid var(--tape);position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px}
header .brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
header img.hdr-logo{width:38px;height:38px;object-fit:contain;background:white;border-radius:7px;padding:2px;flex-shrink:0}
header b{font-size:17px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{display:block;opacity:.88;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync-pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.16);color:white;white-space:nowrap;flex-shrink:0;cursor:pointer}
.sync-pill.online{background:#1b7a43}
main{max-width:780px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(20,35,47,.04)}
h2,h3{margin:0 0 8px}
.m{color:var(--mut);font-size:14px}
.small{font-size:12px;color:var(--mut)}
button{font:inherit;min-height:46px;padding:8px 14px;border:0;border-radius:8px;background:var(--ac);color:white;font-weight:650;margin:3px 3px 3px 0;cursor:pointer}
button.secondary{background:white;color:var(--ac);border:2px solid var(--ac)}
button.danger{background:#9e2525}
button.w{width:100%}
input,select,textarea{font:inherit;width:100%;min-height:45px;padding:9px;border:1px solid #9aa8b0;border-radius:8px;margin:3px 0 10px;background:white;color:var(--ink)}
textarea{min-height:82px}
label{font-weight:650;font-size:14px;display:block}
input[type=checkbox]{width:auto;min-height:auto;margin-right:8px}
.inline-check{display:flex;align-items:flex-start;gap:8px;font-weight:500;font-size:13px;background:#f8fafb;border:1px solid var(--ln);border-radius:8px;padding:10px;margin:6px 0 12px;cursor:pointer}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--ln);align-items:center}
.row:last-child{border:0;padding-bottom:0}
.tag{background:var(--tape);color:#111;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}
.doc-card{border:1px solid var(--ln);border-radius:10px;padding:11px;margin:10px 0;background:#fafbfc}
.doc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.clause-box{border:1px solid var(--ln);border-radius:9px;padding:10px;margin:8px 0;background:#fbfcfd}
.clause-box b{display:block;font-size:13px;color:var(--ac);margin-bottom:4px}
.clause-box p{margin:0;font-size:13px;white-space:pre-line}
.std-list{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.std-badge{background:#eef4f4;color:var(--ac);border:1px solid #c3d5d5;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
canvas.signature{width:100%;height:130px;border:2px dashed #9aa8b0;border-radius:8px;touch-action:none;background:#fff}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{flex:1;background:none;color:var(--mut);border-radius:0;margin:0;min-height:58px;font-size:12px;padding:4px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--tape);font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:#14232f;color:white;padding:10px 15px;border-radius:8px;display:none;z-index:10;max-width:90%;text-align:center}
dialog{width:min(700px,96%);max-height:92vh;border:0;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#0008}
</style>
</head>
<body>
<main id="view"></main>

<script src="core.js"></script>
<script>
"use strict";

let legalSigState = {};

function getContractorDetails() {
  const bName = (brand.name || 'Contractor').trim();
  const bAddr = (brand.address || '').replace(/\n/g, ', ').trim();
  const contactParts = [bAddr, brand.phone, brand.email].filter(Boolean);
  return {
    businessName: bName,
    contactSummary: contactParts.length ? contactParts.join(' - ') : 'contact details on file',
    signatoryName: bName
  };
}

function buildTwelveClauses(data) {
  const contractor = getContractorDetails();
  const clientName = (data.customerName || '[Client Full Name]').trim();
  const clientContact = [data.customerAddress?.replace(/\n/g, ', '), data.customerPhone, data.customerEmail]
    .filter(Boolean)
    .join(' - ') || '[Client Contact Details]';
  const siteAddr = (data.customerAddress || '[Site/Property Address]').replace(/\n/g, ', ').trim();
  const quoteRef = formatDocRef('quo', data.quoteRef || data.contractRef);
  const standardsSummary = (data.standards || []).join('; ') || 'applicable British Standards';

  return [
    {
      num: '1',
      title: 'Parties Identification',
      body: `This Agreement is entered into between ${contractor.businessName}, with contact details including ${contractor.contactSummary} (referred to as the Contractor), and ${clientName}, with contact details including ${clientContact} (referred to as the Client). The services detailed in this agreement will be performed at the following location: ${siteAddr}.\nFor the purposes of this Agreement, "Contractor" refers to ${contractor.businessName}. "Client" refers to the individual or entity commissioning the work. "Services" refers to the specific tasks detailed in the Schedule of Scope of Work at the end of this Agreement. "Schedule" refers to the annexed Schedule of Scope of Work containing task-specific details, material specifications, and compliance standards.`
    },
    {
      num: '2',
      title: 'Scope of Work',
      body: `The Contractor shall carry out the services described in the Schedule of Scope of Work attached at the end of this Agreement (referencing Quotation ${quoteRef}), which is incorporated into this Agreement by reference. The specific tasks, boundaries, material specifications, and timelines are set out in that Schedule. Any variation or modification to the defined scope, or rescheduling requests by either party, must be agreed upon in writing at least 48 hours prior to the scheduled commencement of the affected work to allow for material and schedule adjustments.`
    },
    {
      num: '3',
      title: 'Payment Terms',
      body: `The Client agrees to pay the fees specified in Quotation ${quoteRef} (${GBP(data.totalAmount)}) and detailed within the Schedule of Scope of Work. Payment shall be due strictly within the timeframe stipulated on each respective invoice. Any required deposit must be received prior to the commencement of work. Late payments may incur statutory interest under the Late Payment of Commercial Debts (Interest) Act 1998 where applicable. Method of payment shall be as specified on the invoice.`
    },
    {
      num: '4',
      title: 'Cancellation Policy & Statutory Waiver',
      body: `The Client acknowledges that requesting immediate commencement of the Services constitutes an express request to waive the statutory 14-day cooling-off period under the Consumer Contracts Regulations. Following commencement, either party may terminate this Agreement subject to the agreed written notice period. In the event of cancellation by the Client, the Contractor shall be entitled to full payment for all labor and materials utilized up to the effective date of termination.${data.coolingOffWaiver ? '\n[X] Express Request & Waiver Confirmed: The Client has expressly requested immediate commencement of the Services and acknowledged the waiver of the statutory 14-day cooling-off period under the Consumer Contracts Regulations.' : '\n[ ] Express Request & Waiver: Immediate commencement / 14-day cooling-off waiver box not ticked.'}`
    },
    {
      num: '5',
      title: 'Mutual Obligations',
      body: `The Contractor agrees to perform the Services with reasonable care and skill, strictly adhering to relevant British Standards (${standardsSummary}) and codes of practice applicable to each specific task. The Client agrees to provide necessary site access, ensure a safe working environment, and cooperate timely with all reasonable requests. Both parties agree to maintain open communication and act in good faith.`
    },
    {
      num: '6',
      title: 'Limitation of Liability',
      body: `Except in respect of death or personal injury caused by the Contractor's negligence, the Contractor's total aggregate liability arising under or in connection with this Agreement, whether in contract, tort (including negligence), breach of statutory duty, or otherwise, shall be strictly limited to the total value of the fees payable under the Schedule of Scope of Work. The Contractor shall not be liable for any indirect, consequential, or unforeseeable losses, including but not limited to pre-existing conditions, mismatch of existing materials, or indirect property damage.`
    },
    {
      num: '7',
      title: 'Dispute Resolution & Governing Law',
      body: `In the event of any dispute arising out of or in connection with this Agreement, the parties shall first seek to resolve the matter amicably through direct negotiation. If the dispute cannot be resolved within 14 days, the parties agree to attempt mediation for a period of up to 30 days before resorting to formal legal proceedings. This Agreement shall be governed by and construed in accordance with the laws of England and Wales, and the courts of England and Wales shall have exclusive jurisdiction.`
    },
    {
      num: '8',
      title: 'Force Majeure',
      body: `Neither party shall be held liable or responsible to the other, nor be deemed to have defaulted under or breached this Agreement, for failure or delay in fulfilling or performing any obligation under this Agreement when such failure or delay is caused by or results from causes beyond the reasonable control of the affected party, including but not limited to acts of God, flood, fire, earthquake, or explosion, war, invasion, hostilities, terrorist threats or acts, riot, or other civil unrest, government order, law, or actions, embargoes or blockades, national or regional emergency, strikes, labor stoppages or slowdowns, or other industrial disturbances. The party affected by such event shall promptly notify the other party in writing within a reasonable timeframe, stating the period of time the occurrence is expected to continue.`
    },
    {
      num: '9',
      title: 'Warranties, Defects, and Quality Assurance',
      body: `The Contractor warrants that the Services will be provided with reasonable care and skill and in accordance with applicable British Standards (${standardsSummary}). Upon completion, a joint quality inspection shall be conducted by the Contractor and the Client. The results shall be recorded within the platform's Quality Assurance system, generating a formal Quality Inspection Certificate. The Client must notify the Contractor in writing of any visible defects or snags within 7 days of inspection. The Contractor agrees to rectify any notified defects resulting from faulty workmanship or materials within a reasonable timeframe at no additional cost. This warranty does not cover fair wear and tear, damage caused by the Client or third parties, or pre-existing conditions.`
    },
    {
      num: '10',
      title: 'Insurance Requirements',
      body: `The Contractor shall maintain adequate public liability insurance with a reputable insurer throughout the duration of this Agreement, covering legal liability for accidental death, bodily injury, or property damage arising out of the performance of the Services. Proof of insurance shall be provided to the Client upon request.`
    },
    {
      num: '11',
      title: 'Subcontracting',
      body: `The Contractor may not assign, transfer, or subcontract any of its rights or obligations under this Agreement without the prior written consent of the Client. Where subcontracting is permitted, the Contractor shall remain fully liable and responsible for the performance of all Services and the acts, defaults, and omissions of any subcontractor as if they were the acts, defaults, or omissions of the Contractor.`
    },
    {
      num: '12',
      title: 'Data Protection',
      body: `Both parties agree to comply with their respective obligations under the UK General Data Protection Regulation (UK GDPR) and the Data Protection Act 2018. The Contractor shall process personal data provided by the Client solely for the purpose of fulfilling the Services and shall implement appropriate technical and organizational measures to ensure a level of security appropriate to the risk. Personal data shall not be disclosed to third parties without prior consent, except as required by law.`
    }
  ];
}

async function getTaskQuoteContext(taskId) {
  const task = await get('jobs', taskId);
  if (!task) return null;
  const customer = task.customerId ? await get('customers', task.customerId) : null;
  const quotes = (await all('quotes'))
    .filter((q) => q.jobId === taskId)
    .sort((a, b) => (b.created || 0) - (a.created || 0));
  const quote = quotes[0] || null;
  return { task, customer, quote };
}

async function renderLegalPage() {
  const [tasks, quotes, docs] = await Promise.all([
    all('jobs').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0))),
    all('quotes'),
    all('docs').then((list) => list.sort((a, b) => (b.created || 0) - (a.created || 0)))
  ]);

  const quoteByTask = new Map();
  for (const q of [...quotes].sort((a, b) => (b.created || 0) - (a.created || 0))) {
    if (!quoteByTask.has(q.jobId)) quoteByTask.set(q.jobId, q);
  }

  $('#view').innerHTML = `
    <div class="c">
      <h2>Legal Contracts</h2>
      <p class="m">
        Create a 12-clause contract with the <strong>Schedule of Scope of Work</strong> and relevant <strong>British Standards</strong> at the end, using shared reference numbers (e.g. <code>${esc(formatDocRef('con', '001'))}</code>) and dual signatures.
      </p>
      <button type="button" class="w" onclick="openContractBuilder()">+ Create Contract from Task &amp; Quote</button>
    </div>

    <div class="c">
      <h3>Prepared Contracts (${docs.length})</h3>
      ${
        docs.length
          ? docs
              .map((d) => {
                const isSigned = d.status === 'Signed';
                const conRef = formatDocRef('con', d.contractRef || d.quoteNumber || d.jobRef);
                const quoRef = formatDocRef('quo', d.quoteNumber || d.contractRef || d.jobRef);
                return `
                  <div class="doc-card">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                      <b>${esc(conRef)} - ${esc(d.name)}</b>
                      <span class="tag ${isSigned ? 'ok' : ''}">${esc(d.status || 'Draft')}</span>
                    </div>
                    <div class="m" style="margin-top:4px">
                      Ref: <b>${esc(conRef)}</b> - Quote: <b>${esc(quoRef)}</b>
                      ${d.totalAmount !== undefined ? ` - ${GBP(d.totalAmount)}` : ''}
                    </div>
                    <div class="small">
                      Date Signed / Agreed: ${dateFmt(d.contractData?.signedDate || '') || 'Pending'}
                      ${d.contractData?.workStartDate ? ` - Planned Start of Work: ${dateFmt(d.contractData.workStartDate)}` : ''}
                    </div>
                    <div class="doc-actions">
                      <button type="button" onclick="openLegalDocPdf('${esc(d.id)}')">View / Save PDF</button>
                      <button type="button" class="secondary" onclick="shareLegalDoc('${esc(d.id)}')">Share</button>
                      <button type="button" class="secondary" onclick="openContractBuilder('${esc(d.jobId || '')}', null, '${esc(d.id)}')">Edit</button>
                      <button type="button" class="danger" onclick="confirmDeleteLegalDoc('${esc(d.id)}')">Delete</button>
                    </div>
                  </div>`;
              })
              .join('')
          : '<p class="m">No contracts created yet. Choose a task below to build a contract from its quote.</p>'
      }
    </div>

    <div class="c">
      <h3>Tasks &amp; Quotes Ready for Contract (${tasks.length})</h3>
      ${
        tasks.length
          ? tasks
              .map((t) => {
                const q = quoteByTask.get(t.id);
                const baseRef = q?.documentNumber || t.ref;
                const qRef = formatDocRef('quo', baseRef);
                const cRef = formatDocRef('con', baseRef);
                const stds = resolveBritishStandards(t);
                return `
                  <div class="row">
                    <div>
                      <b>${esc(cRef)} - ${esc(t.customerName)}</b>
                      <div class="m">${esc(t.task || t.description)}</div>
                      <div class="small">Quote: ${esc(qRef)} - ${GBP(q ? q.total : t.amount)}</div>
                      <div class="small">Standards: ${esc(stds.join(', '))}</div>
                    </div>
                    <button type="button" onclick="openContractBuilder('${esc(t.id)}')">Create Contract</button>
                  </div>`;
              })
              .join('')
          : '<p class="m">No tasks found. Create a task and quotation first in Tasks &amp; Quotes.</p>'
      }
    </div>
  `;
}

async function openContractBuilder(preselectedTaskId = '', overrideData = null, existingDocId = '') {
  const existingDoc = existingDocId ? await get('docs', existingDocId) : null;
  const tasks = (await all('jobs')).sort((a, b) => (b.created || 0) - (a.created || 0));
  if (!tasks.length && !existingDoc && !overrideData) {
    toast('Create a task & quotation first');
    return navigateTo('tasks.html', { action: 'new' });
  }

  const targetTaskId =
    overrideData?.taskId || existingDoc?.jobId || preselectedTaskId || tasks[0]?.id || '';
  const ctx = await getTaskQuoteContext(targetTaskId);
  const task = ctx?.task || {};
  const quote = ctx?.quote || null;

  const baseRef = quote?.documentNumber || task.ref || existingDoc?.contractRef;
  const quoteRef = formatDocRef('quo', baseRef);
  const contractRef = formatDocRef('con', baseRef);
  const standards = resolveBritishStandards(task);

  const quoteScheduleLines = quote?.items?.length
    ? quote.items
        .map((item, idx) => `${idx + 1}. ${item.description} - ${GBP(item.amount)}`)
        .join('\n')
    : `1. ${task.task || task.description || 'Agreed work'} - ${GBP(quote ? quote.total : task.amount)}`;

  const contractor = getContractorDetails();
  const base = existingDoc?.contractData || {
    title: existingDoc?.name || `${contractRef} - ${task.task || task.description || 'Service Agreement'}`,
    taskId: task.id || '',
    jobRef: task.ref || '',
    contractRef,
    quoteId: quote?.id || '',
    quoteRef,
    customerName: task.customerName || '',
    customerAddress: task.customerAddress || ctx?.customer?.address || '',
    customerPhone: ctx?.customer?.phone || '',
    customerEmail: ctx?.customer?.email || '',
    standardsText: standards.join('\n'),
    standards,
    scopeSummary: task.description || '',
    scheduleItemsText: quoteScheduleLines,
    scheduleNotes: quote?.notes || '',
    totalAmount: quote ? Number(quote.total) || 0 : Number(task.amount) || 0,
    coolingOffWaiver: true,
    contractorSignatory: contractor.signatoryName,
    clientSignatory: task.customerName || '',
    signedDate: today(),
    workStartDate: ''
  };

  const d = { ...base, ...(overrideData || {}) };
  d.contractRef = formatDocRef('con', d.contractRef || d.quoteRef || task.ref);
  d.quoteRef = formatDocRef('quo', d.quoteRef || d.contractRef || task.ref);
  const activeStandards = (d.standardsText || '')
    .split('\n')
    .map((s) => s.trim())
    .filter(Boolean);
  d.standards = activeStandards.length ? activeStandards : standards;
  const previewClauses = buildTwelveClauses(d);

  modal(`
    <h2>${existingDoc ? 'Edit' : 'Create'} Contract (${esc(d.contractRef)})</h2>
    <p class="m">12 clauses followed by the <strong>Schedule of Scope of Work</strong> and <strong>British Standards</strong> at the end.</p>

    <form id="contractForm" onsubmit="event.preventDefault();saveContract('${esc(existingDoc?.id || '')}')">
      <label>Select Task</label>
      <select name="taskId" id="contractTaskSelect" onchange="switchContractTask(this.value, '${esc(existingDoc?.id || '')}')">
        ${tasks
          .map(
            (t) =>
              `<option value="${esc(t.id)}" ${t.id === d.taskId ? 'selected' : ''}>${esc(formatDocRef('tsk', t.ref))} - ${esc(t.customerName)}</option>`
          )
          .join('')}
      </select>

      <label>Contract Reference</label>
      <input name="contractRef" value="${esc(d.contractRef)}" readonly>

      <label>Contract Title</label>
      <input name="title" value="${esc(d.title)}" required>

      <label>Linked Quotation Reference &amp; Total</label>
      <input name="quoteSummary" value="${esc(`${d.quoteRef} - ${GBP(d.totalAmount)}`)}" readonly>

      <label>Client Full Name</label>
      <input name="customerName" value="${esc(d.customerName)}" required>

      <label>Site / Property Address</label>
      <textarea name="customerAddress">${esc(d.customerAddress)}</textarea>

      <label>Date Contract Signed / Agreed</label>
      <input name="signedDate" type="date" value="${esc(d.signedDate || today())}" required>

      <label>Planned Start of Work Date (Optional)</label>
      <input name="workStartDate" type="date" value="${esc(d.workStartDate || '')}">

      <label class="inline-check">
        <input type="checkbox" name="coolingOffWaiver" value="yes" ${d.coolingOffWaiver ? 'checked' : ''}>
        <span><b>Clause 4 Waiver:</b> I expressly request immediate commencement of the Services and acknowledge that this constitutes a waiver of the statutory 14-day cooling-off period under the Consumer Contracts Regulations.</span>
      </label>

      <div class="c">
        <h3>12 Contract Clauses Preview</h3>
        ${previewClauses
          .map(
            (cl) => `
            <div class="clause-box">
              <b>${cl.num}. ${esc(cl.title)}</b>
              <p>${esc(cl.body)}</p>
            </div>`
          )
          .join('')}
      </div>

      <div class="c" style="background:#f8fafb">
        <h3>Schedule of Scope of Work &amp; British Standards (Placed at End of Contract)</h3>
        <div class="std-list">
          ${d.standards.map((s) => `<span class="std-badge">${esc(s)}</span>`).join('')}
        </div>

        <label>Relevant British Standards (one per line)</label>
        <textarea name="standardsText">${esc(d.standardsText)}</textarea>

        <label>Task Scope &amp; Deliverables</label>
        <textarea name="scopeSummary" required>${esc(d.scopeSummary)}</textarea>

        <label>Quoted Items &amp; Schedule Breakdown</label>
        <textarea name="scheduleItemsText">${esc(d.scheduleItemsText)}</textarea>

        <label>Schedule Notes &amp; Material Specifications</label>
        <textarea name="scheduleNotes">${esc(d.scheduleNotes)}</textarea>

        <label>Contract Total (£)</label>
        <input name="totalAmount" type="number" step="0.01" min="0" value="${Number(d.totalAmount) || 0}" required>
      </div>

      <div class="c">
        <h3>Dual Sign-Off</h3>
        <label>Contractor Signatory (from Branding)</label>
        <input name="contractorSignatory" value="${esc(d.contractorSignatory)}" required>

        <label>Contractor Signature</label>
        <canvas id="sigContractor" class="signature"></canvas>
        <button type="button" class="secondary" onclick="clearLegalSig('sigContractor')">Clear Contractor Signature</button>

        <label style="margin-top:10px">Client Signatory</label>
        <input name="clientSignatory" value="${esc(d.clientSignatory)}" required>

        <label>Client Signature</label>
        <canvas id="sigClient" class="signature"></canvas>
        <button type="button" class="secondary" onclick="clearLegalSig('sigClient')">Clear Client Signature</button>
      </div>

      <button type="submit" class="w" style="margin-top:8px">Save Contract &amp; Generate PDF</button>
    </form>
  `);

  initLegalSigPad('sigContractor', existingDoc?.contractorSignature || '');
  initLegalSigPad('sigClient', existingDoc?.clientSignature || '');
}

function collectContractFormValues() {
  const form = $('#contractForm');
  if (!form) return {};
  const f = formData(form);
  const stdLines = (f.standardsText || '')
    .split('\n')
    .map((s) => s.trim())
    .filter(Boolean);
  return {
    title: f.title || '',
    customerName: f.customerName || '',
    customerAddress: f.customerAddress || '',
    signedDate: f.signedDate || today(),
    workStartDate: f.workStartDate || '',
    coolingOffWaiver: Boolean(form.querySelector('[name="coolingOffWaiver"]')?.checked),
    standardsText: f.standardsText || '',
    standards: stdLines,
    scopeSummary: f.scopeSummary || '',
    scheduleItemsText: f.scheduleItemsText || '',
    scheduleNotes: f.scheduleNotes || '',
    totalAmount: Number(f.totalAmount) || 0,
    contractorSignatory: f.contractorSignatory || '',
    clientSignatory: f.clientSignatory || ''
  };
}

async function switchContractTask(newTaskId, existingDocId = '') {
  const currentVals = collectContractFormValues();
  const ctx = await getTaskQuoteContext(newTaskId);
  const task = ctx?.task || {};
  const quote = ctx?.quote || null;
  const baseRef = quote?.documentNumber || task.ref;
  const quoteRef = formatDocRef('quo', baseRef);
  const contractRef = formatDocRef('con', baseRef);
  const stds = resolveBritishStandards(task);
  const quoteLines = quote?.items?.length
    ? quote.items.map((item, idx) => `${idx + 1}. ${item.description} - ${GBP(item.amount)}`).join('\n')
    : `1. ${task.task || task.description || 'Agreed work'} - ${GBP(quote ? quote.total : task.amount)}`;

  await openContractBuilder(
    newTaskId,
    {
      ...currentVals,
      taskId: task.id || '',
      jobRef: task.ref || '',
      contractRef,
      quoteId: quote?.id || '',
      quoteRef,
      customerName: task.customerName || currentVals.customerName || '',
      customerAddress: task.customerAddress || ctx?.customer?.address || currentVals.customerAddress || '',
      customerPhone: ctx?.customer?.phone || '',
      customerEmail: ctx?.customer?.email || '',
      standardsText: stds.join('\n'),
      standards: stds,
      scopeSummary: task.description || currentVals.scopeSummary || '',
      scheduleItemsText: quoteLines,
      scheduleNotes: quote?.notes || '',
      totalAmount: quote ? Number(quote.total) || 0 : Number(task.amount) || 0,
      clientSignatory: task.customerName || currentVals.clientSignatory || ''
    },
    existingDocId
  );
}

function initLegalSigPad(id, existingDataUrl = '') {
  const canvas = $('#' + id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = 760;
  canvas.height = 220;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#14232f';
  legalSigState[id] = { drawn: false };

  if (existingDataUrl) {
    const img = new Image();
    img.onload = () => {
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      legalSigState[id].drawn = true;
    };
    img.src = existingDataUrl;
  }

  let drawing = false;
  const pt = (e) => {
    const r = canvas.getBoundingClientRect();
    return [
      ((e.clientX - r.left) * canvas.width) / r.width,
      ((e.clientY - r.top) * canvas.height) / r.height
    ];
  };

  canvas.onpointerdown = (e) => {
    drawing = true;
    canvas.setPointerCapture(e.pointerId);
    ctx.beginPath();
    ctx.moveTo(...pt(e));
  };
  canvas.onpointermove = (e) => {
    if (!drawing) return;
    ctx.lineTo(...pt(e));
    ctx.stroke();
    legalSigState[id].drawn = true;
  };
  canvas.onpointerup = canvas.onpointercancel = () => {
    drawing = false;
  };
}

function clearLegalSig(id) {
  const canvas = $('#' + id);
  if (!canvas) return;
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  if (legalSigState[id]) legalSigState[id].drawn = false;
}

async function saveContract(existingDocId = '') {
  const form = $('#contractForm');
  if (!form || !form.reportValidity()) return;

  const vals = collectContractFormValues();
  const taskId = $('#contractTaskSelect')?.value || '';
  const ctx = await getTaskQuoteContext(taskId);
  if (!ctx?.task) return toast('Please choose a valid task');

  const old = existingDocId ? await get('docs', existingDocId) : null;
  const task = ctx.task;
  const quote = ctx.quote;
  const baseRef = quote?.documentNumber || task.ref || old?.contractRef;
  const contractRef = formatDocRef('con', baseRef);
  const quoteRef = formatDocRef('quo', baseRef);
  const standards = vals.standards?.length ? vals.standards : resolveBritishStandards(task);

  const contractData = {
    title: (vals.title || `${contractRef} - ${task.task || task.description || 'Service Agreement'}`).trim(),
    taskId: task.id,
    jobRef: task.ref,
    contractRef,
    quoteId: quote?.id || '',
    quoteRef,
    customerName: (vals.customerName || task.customerName).trim(),
    customerAddress: (vals.customerAddress || '').trim(),
    customerPhone: ctx.customer?.phone || '',
    customerEmail: ctx.customer?.email || '',
    standards,
    standardsText: standards.join('\n'),
    scopeSummary: (vals.scopeSummary || '').trim(),
    scheduleItemsText: (vals.scheduleItemsText || '').trim(),
    scheduleNotes: (vals.scheduleNotes || '').trim(),
    totalAmount: Number(vals.totalAmount) || 0,
    coolingOffWaiver: Boolean(vals.coolingOffWaiver),
    contractorSignatory: (vals.contractorSignatory || getContractorDetails().signatoryName).trim(),
    clientSignatory: (vals.clientSignatory || task.customerName).trim(),
    signedDate: vals.signedDate || today(),
    workStartDate: vals.workStartDate || ''
  };

  const contractorSigUrl = legalSigState.sigContractor?.drawn
    ? $('#sigContractor').toDataURL('image/png')
    : '';
  const clientSigUrl = legalSigState.sigClient?.drawn
    ? $('#sigClient').toDataURL('image/png')
    : '';

  const status = contractorSigUrl && clientSigUrl ? 'Signed' : 'Draft';

  try {
    const pdfBlob = await makeContractPdf(contractData, contractorSigUrl, clientSigUrl);
    const filename = `${contractRef}.pdf`;
    const dataUrl = await fileData(new File([pdfBlob], filename, { type: 'application/pdf' }));

    let pdfStorage = old?.pdfStorage || null;
    if (isSupabaseConfigured()) {
      try {
        pdfStorage = await uploadPdfToSupabase(pdfBlob, `contracts/${contractRef}/${filename}`);
      } catch (upErr) {
        console.warn('Contract PDF upload skipped:', upErr.message);
      }
    }

    const record = {
      ...(old || {}),
      id: old?.id || uid(),
      docType: 'contract-12',
      jobId: task.id,
      jobRef: task.ref,
      contractRef,
      quoteId: contractData.quoteId,
      quoteNumber: quoteRef,
      totalAmount: contractData.totalAmount,
      name: contractData.title,
      filename,
      data: dataUrl,
      pdfStorage,
      contractData,
      contractorSignature: contractorSigUrl,
      clientSignature: clientSigUrl,
      status,
      created: old?.created || Date.now(),
      updatedAt: Date.now()
    };

    await put('docs', record);
    closeModal();
    toast(existingDocId ? 'Contract updated' : `Contract ${contractRef} saved & PDF generated`);
    await renderLegalPage();
  } catch (e) {
    console.error(e);
    toast('Could not generate contract PDF: ' + e.message);
  }
}

async function makeContractPdf(cData, contractorSigUrl, clientSigUrl) {
  const ctx = await createBrandedPdfDocument();
  const { pdf, font, bold, width: W, height: H, margin } = ctx;
  const refBadge = pdfSafeText(cData.contractRef || '');
  const [ar, ag, ab] = hexToRgbTuple(brand.color || '#0f5c5c');
  const accentCol = PDFLib.rgb(ar, ag, ab);
  const inkCol = PDFLib.rgb(0.08, 0.14, 0.18);
  const ruleCol = PDFLib.rgb(0.82, 0.86, 0.89);
  const tintCol = PDFLib.rgb(0.96, 0.97, 0.98);

  let page = pdf.addPage([W, H]);
  let y = drawStandardPdfHeader(ctx, page, 'SERVICE CONTRACT', refBadge);

  function startNewPage() {
    page = pdf.addPage([W, H]);
    y = drawStandardPdfHeader(ctx, page, 'SERVICE CONTRACT', refBadge);
  }

  function ensureSpace(needed = 24) {
    if (y - needed < 68) {
      startNewPage();
    }
  }

  function drawDivider() {
    ensureSpace(14);
    page.drawLine({
      start: { x: margin, y: y + 4 },
      end: { x: W - margin, y: y + 4 },
      thickness: 0.5,
      color: ruleCol
    });
    y -= 10;
  }

  function writeParagraphs(text, size = 9, isBold = false, indent = 0) {
    const blocks = pdfSafeText(text || '').split('\n');
    const maxW = W - margin * 2 - indent - 6;
    for (const block of blocks) {
      const words = block.trim().split(/\s+/).filter(Boolean);
      if (!words.length) {
        ensureSpace(size + 4);
        y -= size + 4;
        continue;
      }
      let line = '';
      for (const w of words) {
        const test = line ? `${line} ${w}` : w;
        if (font.widthOfTextAtSize(pdfSafeText(test), size) > maxW && line) {
          ensureSpace(size + 4.5);
          page.drawText(pdfSafeText(line), {
            x: margin + indent,
            y,
            size,
            font: isBold ? bold : font,
            color: inkCol
          });
          y -= size + 4.5;
          line = w;
        } else {
          line = test;
        }
      }
      if (line) {
        ensureSpace(size + 4.5);
        page.drawText(pdfSafeText(line), {
          x: margin + indent,
          y,
          size,
          font: isBold ? bold : font,
          color: inkCol
        });
        y -= size + 4.5;
      }
    }
  }

  function sectionHeading(title) {
    ensureSpace(28);
    y -= 6;
    page.drawRectangle({
      x: margin,
      y: y - 3,
      width: W - margin * 2,
      height: 17,
      color: tintCol
    });
    page.drawText(pdfSafeText(String(title || '').toUpperCase()), {
      x: margin + 6,
      y: y + 1,
      size: 9.5,
      font: bold,
      color: accentCol
    });
    y -= 18;
  }

  // Contract Header Summary
  writeParagraphs(cData.title || 'Service Agreement', 13, true);
  writeParagraphs(
    `Contract Ref: ${cData.contractRef || ''} - Quote Ref: ${cData.quoteRef || ''} - Total: ${GBP(cData.totalAmount)}`,
    9.5,
    true
  );
  writeParagraphs(
    `Date Signed / Agreed: ${dateFmt(cData.signedDate || '') || 'Not dated'}${cData.workStartDate ? ` - Planned Start of Work: ${dateFmt(cData.workStartDate)}` : ''}`,
    9,
    false
  );
  drawDivider();

  // Clauses 1 to 12
  const clauses = buildTwelveClauses(cData);
  for (const cl of clauses) {
    sectionHeading(`${cl.num}. ${cl.title}`);
    writeParagraphs(cl.body, 8.8, false, 2);
    y -= 3;
  }

  // Schedule of Scope of Work & British Standards at the END of the contract
  startNewPage();
  sectionHeading(`Schedule of Scope of Work (${cData.contractRef || ''})`);
  writeParagraphs(`Quotation Reference: ${cData.quoteRef || ''}`, 9.5, true, 2);
  writeParagraphs(`Client: ${cData.customerName || ''}`, 9.5, false, 2);
  if (cData.customerAddress) {
    writeParagraphs(`Property Address: ${cData.customerAddress.replace(/\n/g, ', ')}`, 9, false, 2);
  }
  y -= 4;

  writeParagraphs('Scope of Work Summary:', 9.5, true, 2);
  writeParagraphs(cData.scopeSummary || '', 9, false, 6);
  y -= 4;

  writeParagraphs('Quoted Schedule Items:', 9.5, true, 2);
  writeParagraphs(cData.scheduleItemsText || '', 9, false, 6);
  y -= 4;

  if (cData.scheduleNotes) {
    writeParagraphs('Additional Notes & Material Specifications:', 9.5, true, 2);
    writeParagraphs(cData.scheduleNotes, 9, false, 6);
    y -= 4;
  }

  writeParagraphs(`Schedule Total: ${GBP(cData.totalAmount)}`, 10.5, true, 2);
  y -= 6;

  sectionHeading('Applicable British Standards');
  const stds = cData.standards?.length ? cData.standards : resolveBritishStandards(cData);
  for (const s of stds) {
    writeParagraphs(`- ${s}`, 9.2, false, 4);
  }
  y -= 8;

  // Dual Signature Blocks at the end
  sectionHeading('Agreement Execution & Signatures');
  for (const [roleLabel, sigName, sigUrl] of [
    ['Contractor', cData.contractorSignatory, contractorSigUrl],
    ['Client', cData.clientSignatory, clientSigUrl]
  ]) {
    ensureSpace(88);
    writeParagraphs(`${roleLabel}: ${sigName || '_________________________'}`, 9.5, true, 2);
    if (sigUrl) {
      try {
        const bytes = Uint8Array.from(atob(sigUrl.split(',')[1]), (ch) => ch.charCodeAt(0));
        const img = await pdf.embedPng(bytes);
        const dims = img.scale(Math.min(155 / img.width, 46 / img.height));
        page.drawImage(img, {
          x: margin + 6,
          y: y - dims.height,
          width: dims.width,
          height: dims.height
        });
        y -= dims.height + 12;
      } catch (e) {
        y -= 20;
      }
    } else {
      writeParagraphs('Signature: [Awaiting signature]', 9, false, 6);
    }
  }

  applyStandardPdfFooters(ctx, `Contract ${cData.contractRef || ''}`);
  return new Blob([await pdf.save()], { type: 'application/pdf' });
}

async function resolveLegalDocBlob(d) {
  if (d.data) {
    return await fetch(d.data).then((r) => r.blob());
  }
  if (d.pdfStorage) {
    const remote = await fetchPdfBlobFromSupabase(d.pdfStorage);
    if (remote) return remote;
  }
  if (d.contractData) {
    return await makeContractPdf(
      d.contractData,
      d.contractorSignature || '',
      d.clientSignature || ''
    );
  }
  throw new Error('Contract PDF not found');
}

async function openLegalDocPdf(docId) {
  const win = window.open('about:blank', '_blank');
  try {
    const d = await get('docs', docId);
    if (!d) throw new Error('Contract not found');
    const blob = await resolveLegalDocBlob(d);
    presentPdf(blob, d.filename || `${d.contractRef || 'Contract'}.pdf`, win);
  } catch (e) {
    if (win) win.close();
    toast('Could not open PDF: ' + e.message);
  }
}

async function shareLegalDoc(docId) {
  try {
    const d = await get('docs', docId);
    if (!d) throw new Error('Contract not found');
    const blob = await resolveLegalDocBlob(d);
    await shareOrDownloadFile(blob, d.filename || `${d.contractRef || 'Contract'}.pdf`, d.name || 'Contract');
  } catch (e) {
    toast('Could not share PDF: ' + e.message);
  }
}

function confirmDeleteLegalDoc(docId) {
  modal(`
    <h2>Delete Contract?</h2>
    <p class="m">Remove this prepared contract? The task and quotation remain untouched.</p>
    <button type="button" class="danger w" onclick="deleteLegalDoc('${esc(docId)}')">Yes, Delete Contract</button>
  `);
}

async function deleteLegalDoc(docId) {
  await del('docs', docId);
  closeModal();
  toast('Contract deleted');
  await renderLegalPage();
}

(async () => {
  try {
    const { params } = await initCore('legal');
    await renderLegalPage();

    if (params.taskId) {
      const tId = params.taskId;
      clearQueryParams();
      await openContractBuilder(tId);
    }
  } catch (e) {
    console.error('Legal boot error:', e);
  }
})();
